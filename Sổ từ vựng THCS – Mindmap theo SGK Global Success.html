icine,” she says. “You need rest and a healthy diet.”","“Cháu không cần uống thuốc,” bác sĩ nói. “Cháu cần nghỉ ngơi và ăn uống lành mạnh.”"],["She explains that teenagers need about eight hours of sleep.","Bác sĩ giải thích rằng tuổi thiếu niên cần ngủ khoảng tám tiếng."],["They should eat fruit and vegetables and avoid unhealthy snacks.","Các bạn nên ăn rau quả và tránh đồ ăn vặt không lành mạnh."],["Regular exercise, like jogging or swimming, also helps them stay fit and reduce stress.","Tập thể dục đều đặn như chạy bộ hay bơi lội cũng giúp giữ dáng và giảm căng thẳng."],["Good hygiene, such as washing hands, protects them from disease.","Vệ sinh tốt, như rửa tay, giúp phòng tránh bệnh tật."],["Nam follows her advice, and in two weeks he recovers completely.","Nam làm theo lời khuyên và hai tuần sau thì hồi phục hoàn toàn."],["He learns that health is the most important thing for success.","Cậu hiểu ra rằng sức khỏe là điều quan trọng nhất để thành công."]]},"9.4":{"t":"A Visit to Hue Citadel","tv":"Thăm Đại Nội Huế","s":[["In the summer, Lan's family visits Hue, the old capital of Viet Nam.","Mùa hè, gia đình Lan đến thăm Huế, cố đô của Việt Nam."],["Hue Citadel was built by the Nguyen dynasty in the nineteenth century.","Đại Nội Huế do triều Nguyễn xây dựng vào thế kỷ 19."],["The emperors and queens lived and worked in its beautiful palaces.","Các vị hoàng đế và hoàng hậu sống và làm việc trong những cung điện tráng lệ ở đây."],["Some parts were destroyed during the war, and today we can only see the ruins.","Một số phần đã bị phá hủy trong chiến tranh, và hôm nay ta chỉ còn thấy tàn tích."],["A guide shows them old relics and tells stories about historical battles.","Một hướng dẫn viên cho họ xem các di vật cổ và kể chuyện về những trận đánh lịch sử."],["Lan's grandfather tells her about life in the old days.","Ông của Lan kể cho cô bé nghe về cuộc sống ngày xưa."],["“When I was young, we used to study under an oil lamp,” he says.","“Hồi ông còn nhỏ, bọn ông học bài dưới ánh đèn dầu,” ông kể."],["“Children used to walk barefoot to school, and many houses had thatched roofs.”","“Trẻ con thường đi chân đất đến trường, và nhiều nhà lợp mái tranh.”"],["Lan realizes there is a big generation gap between them.","Lan nhận ra giữa hai ông cháu có một khoảng cách thế hệ lớn."],["But she also understands why remembering the past is important.","Nhưng bạn ấy cũng hiểu vì sao việc ghi nhớ quá khứ lại quan trọng."],["It helps us respect our heroes and keep our traditions alive.","Nó giúp ta biết ơn các anh hùng và giữ gìn truyền thống."]]},"9.5":{"t":"My Most Memorable Experience","tv":"Trải nghiệm đáng nhớ nhất của tớ","s":[["Last summer, Mai joined a summer camp in Da Lat for the first time.","Mùa hè năm ngoái, Mai lần đầu tham gia một trại hè ở Đà Lạt."],["She was nervous because she had never been away from home.","Bạn ấy hồi hộp vì chưa bao giờ xa nhà."],["On the second day, her group went hiking in the forest.","Ngày thứ hai, nhóm của bạn ấy đi bộ đường dài trong rừng."],["They got lost, and it started to rain.","Cả nhóm bị lạc và trời bắt đầu đổ mưa."],["It was a frightening experience, and some of the younger kids cried.","Đó là một trải nghiệm đáng sợ, và vài em nhỏ đã khóc."],["Mai decided to stay calm and look after them.","Mai quyết định giữ bình tĩnh và chăm sóc các em."],["She used the compass from her bag and found the way back to the camp.","Bạn ấy dùng chiếc la bàn trong ba lô và tìm được đường về trại."],["The leaders said she was very brave.","Các anh chị phụ trách khen bạn ấy rất dũng cảm."],["It was the proudest moment of her life.","Đó là khoảnh khắc tự hào nhất trong đời bạn ấy."],["From this challenge, Mai gained a lot of confidence.","Qua thử thách này, Mai trở nên tự tin hơn rất nhiều."],["The lesson she learned: you can overcome your fears if you don't give up.","Bài học bạn ấy rút ra: bạn có thể vượt qua nỗi sợ nếu không bỏ cuộc."],["It was truly an unforgettable summer.","Đó thật sự là một mùa hè không thể quên."]]},"9.6":{"t":"Life Then and Now","tv":"Cuộc sống xưa và nay","s":[["Minh interviews his grandmother about life in Ha Noi in the 1980s.","Minh phỏng vấn bà về cuộc sống ở Hà Nội những năm 1980."],["At that time, people lived in extended families with three or four generations.","Hồi đó, người ta sống trong những gia đình nhiều thế hệ, ba bốn thế hệ chung một nhà."],["During the subsidy period, they used ration books to buy rice, meat and sugar.","Thời bao cấp, mọi người dùng tem phiếu để mua gạo, thịt và đường."],["People had to queue up for hours at state shops.","Người ta phải xếp hàng hàng giờ ở các cửa hàng mậu dịch."],["Some streets still had tram cars, and most people went everywhere by bicycle.","Một số con phố vẫn còn tàu điện, và hầu hết mọi người đi đâu cũng bằng xe đạp."],["Many things were hand-made, and families cooked in a clay cooking pot over a fire.","Nhiều đồ dùng làm thủ công, và các gia đình nấu ăn bằng nồi đất trên bếp lửa."],["Nowadays, Vietnamese lifestyle has changed rapidly.","Ngày nay, lối sống của người Việt đã thay đổi rất nhanh."],["Most youngsters live in nuclear families and use smartphones every day.","Hầu hết người trẻ sống trong gia đình hạt nhân và dùng điện thoại thông minh hằng ngày."],["Life is more convenient, but Grandma says people are busier and talk to each other less.","Cuộc sống tiện lợi hơn, nhưng bà nói con người bận rộn hơn và ít trò chuyện với nhau hơn."],["Minh decides to spend more time with the elders in his family.","Minh quyết định dành nhiều thời gian hơn cho ông bà."],["He thinks modern life is good, but some old values are worth keeping.","Cậu nghĩ cuộc sống hiện đại là tốt, nhưng một số giá trị xưa vẫn đáng gìn giữ."]]},"9.7":{"t":"Wonders of Our Planet","tv":"Kỳ quan của hành tinh chúng ta","s":[["Lan dreams of becoming an explorer and seeing the natural wonders of the world.","Lan mơ trở thành nhà thám hiểm và được ngắm những kỳ quan thiên nhiên của thế giới."],["Her first choice is the Grand Canyon in the USA, with its breathtaking red cliffs.","Lựa chọn đầu tiên của bạn ấy là hẻm núi Grand Canyon ở Mỹ với những vách đá đỏ ngoạn mục."],["Then she wants to climb near Mount Everest, the highest mountain on Earth.","Sau đó bạn ấy muốn leo gần đỉnh Everest, ngọn núi cao nhất Trái Đất."],["She would also love to dive at the Great Barrier Reef, which is home to thousands of species.","Bạn ấy cũng rất muốn lặn ở rạn san hô Great Barrier, nơi sinh sống của hàng nghìn loài."],["The Amazon rainforest is majestic, but it is in danger because of deforestation.","Rừng mưa Amazon thật uy nghi, nhưng đang gặp nguy vì nạn phá rừng."],["Niagara Falls is so spectacular that millions of tourists visit it every year.","Thác Niagara hùng vĩ đến mức mỗi năm có hàng triệu du khách đến thăm."],["But Lan's teacher reminds her that Viet Nam also has amazing wonders.","Nhưng cô giáo nhắc Lan rằng Việt Nam cũng có những kỳ quan tuyệt vời."],["Ha Long Bay, with its limestone islands, was recognized as a World Natural Heritage Site.","Vịnh Hạ Long với những đảo đá vôi đã được công nhận là Di sản Thiên nhiên Thế giới."],["Son Doong is the largest cave in the world, and it has its own jungle inside.","Sơn Đoòng là hang động lớn nhất thế giới, bên trong còn có cả một khu rừng."],["Lan says, “I want to admire every picturesque place, but I also want to protect it.”","Lan nói: “Mình muốn được chiêm ngưỡng mọi nơi đẹp như tranh, nhưng cũng muốn bảo vệ chúng.”"]]},"9.8":{"t":"Planning a Trip to Da Nang","tv":"Lên kế hoạch đi Đà Nẵng","s":[["After the entrance exam, the four friends plan a holiday in Da Nang.","Sau kỳ thi vào lớp 10, bốn bạn lên kế hoạch đi nghỉ ở Đà Nẵng."],["Lan makes the itinerary and the schedule for five days.","Lan lập lịch trình và thời gian biểu cho năm ngày."],["Minh makes a booking for a cheap hotel near the beach.","Minh đặt một khách sạn giá rẻ gần biển."],["They don't need a passport or a visa because they aren't going abroad.","Các bạn không cần hộ chiếu hay thị thực vì không đi nước ngoài."],["Nam wants to go camping, so he packs a tent in his luggage.","Nam muốn cắm trại nên nhét thêm một cái lều vào hành lý."],["On the first day, they check in and go sightseeing in the city.","Ngày đầu tiên, các bạn nhận phòng rồi đi tham quan thành phố."],["They take a tour to Ba Na Hills and walk across the famous Golden Bridge.","Các bạn đi tour lên Bà Nà và đi bộ qua Cầu Vàng nổi tiếng."],["A local guide tells them that tourism is very important for the city's economy.","Một hướng dẫn viên địa phương kể rằng du lịch rất quan trọng với kinh tế thành phố."],["On the third day, they explore Hoi An, a popular destination for foreign tourists.","Ngày thứ ba, các bạn khám phá Hội An, điểm đến ưa thích của du khách nước ngoài."],["Mai buys a lantern as a souvenir and sends a postcard to her grandma.","Mai mua một chiếc đèn lồng làm quà lưu niệm và gửi bưu thiếp cho bà."],["On the last day, they check out early, tired but happy.","Ngày cuối, các bạn trả phòng sớm, mệt nhưng vui."],["It was the best adventure of the summer.","Đó là chuyến phiêu lưu tuyệt nhất mùa hè."]]},"9.9":{"t":"Many Kinds of English","tv":"Nhiều kiểu tiếng Anh","s":[["English is a global language, but it is not the same everywhere.","Tiếng Anh là ngôn ngữ toàn cầu, nhưng không ở đâu giống ở đâu."],["For about 400 million people, it is their mother tongue.","Với khoảng 400 triệu người, đó là tiếng mẹ đẻ."],["Many more people speak it as a second language or a foreign language.","Còn nhiều người hơn thế nói tiếng Anh như ngôn ngữ thứ hai hoặc ngoại ngữ."],["In Singapore, India and the Philippines, English is an official language with its own local variety.","Ở Singapore, Ấn Độ và Phi-líp-pin, tiếng Anh là ngôn ngữ chính thức với những biến thể riêng."],["These are called World Englishes.","Những biến thể đó được gọi là các biến thể tiếng Anh trên thế giới."],["A native speaker from London has a different accent from one in Texas.","Một người bản ngữ ở Luân Đôn có giọng khác hẳn người ở Texas."],["Even spelling can be different: British people write “colour”, but Americans write “color”.","Ngay cả chính tả cũng khác: người Anh viết “colour”, còn người Mỹ viết “color”."],["Lan used to worry because she couldn't speak like a native speaker.","Lan từng lo lắng vì bạn ấy không nói được như người bản ngữ."],["Her teacher said, “Your accent is not a problem. What matters is that you communicate effectively.”","Cô giáo nói: “Giọng của em không phải là vấn đề. Điều quan trọng là em giao tiếp hiệu quả.”"],["Now Lan isn't afraid to make mistakes.","Giờ Lan không còn sợ mắc lỗi."],["She imitates speakers in podcasts, looks up new words and is making progress every day.","Bạn ấy bắt chước người nói trong các chương trình podcast, tra từ mới và tiến bộ từng ngày."],["She hopes to become fluent and maybe bilingual one day.","Bạn ấy hy vọng sẽ nói lưu loát và có thể thành người song ngữ một ngày nào đó."]]},"9.10":{"t":"Our Amazing Planet","tv":"Hành tinh tuyệt vời của chúng ta","s":[["Earth is the only planet we know that has living things.","Trái Đất là hành tinh duy nhất mà ta biết là có sự sống."],["Millions of species live in different habitats, from deep oceans to high mountains.","Hàng triệu loài sinh sống ở những môi trường khác nhau, từ đại dương sâu thẳm đến núi cao."],["Whales and dolphins swim in the sea, while eagles fly above the clouds.","Cá voi và cá heo bơi dưới biển, còn đại bàng bay trên những tầng mây."],["In the jungle, tigers hunt at night, and monkeys climb the trees.","Trong rừng rậm, hổ săn mồi về đêm, còn khỉ leo trèo trên cây."],["Even tiny insects, like bees and ants, are important for the ecosystem.","Ngay cả những côn trùng tí hon như ong và kiến cũng quan trọng với hệ sinh thái."],["Bees help flowers to grow and reproduce.","Ong giúp hoa sinh trưởng và sinh sản."],["Millions of years ago, dinosaurs lived on Earth, but now they are extinct.","Hàng triệu năm trước, khủng long sống trên Trái Đất, nhưng giờ chúng đã tuyệt chủng."],["Scientists study fossils to learn about evolution.","Các nhà khoa học nghiên cứu hóa thạch để tìm hiểu về sự tiến hóa."],["Today, many animals, like pandas, rhinos and sea turtles, are endangered.","Ngày nay, nhiều loài vật như gấu trúc, tê giác và rùa biển đang có nguy cơ tuyệt chủng."],["Humans destroy their habitats when they cut down forests and pollute the oceans.","Con người phá hủy môi trường sống của chúng khi chặt phá rừng và làm ô nhiễm đại dương."],["We share this planet with all living things, so we must protect it.","Chúng ta chung sống trên hành tinh này với muôn loài, vì vậy phải bảo vệ nó."]]},"9.11":{"t":"Minh's New Laptop","tv":"Chiếc máy tính mới của Minh","s":[["For his fifteenth birthday, Minh gets a new laptop.","Sinh nhật mười lăm tuổi, Minh được tặng một chiếc máy tính xách tay mới."],["It has a fast keyboard, a large touch screen and a good webcam for online classes.","Nó có bàn phím gõ nhanh, màn hình cảm ứng lớn và webcam tốt để học trực tuyến."],["His sister has a smartwatch that counts her steps and checks her heart rate.","Chị cậu có một chiếc đồng hồ thông minh đếm bước chân và đo nhịp tim."],["Their father uses a tablet to read the news, and their mother prefers her smartphone.","Bố dùng máy tính bảng để đọc tin tức, còn mẹ thích dùng điện thoại thông minh."],["At home, there are wireless speakers and a robot vacuum cleaner.","Ở nhà có loa không dây và một chiếc rô-bốt hút bụi."],["Electronic devices make life easier, but they also have problems.","Thiết bị điện tử giúp cuộc sống dễ dàng hơn nhưng cũng có những vấn đề."],["Minh forgets his charger at school, and his battery dies before he finishes his homework.","Minh quên bộ sạc ở trường và máy hết pin trước khi cậu làm xong bài tập."],["Now he always carries a power bank in his bag.","Giờ cậu luôn mang theo sạc dự phòng trong cặp."],["His mother sets a rule: no gadgets at the dinner table.","Mẹ cậu đặt ra quy định: không dùng thiết bị điện tử trên bàn ăn."],["At first Minh doesn't like it, but soon he enjoys talking with his family again.","Lúc đầu Minh không thích, nhưng chẳng bao lâu cậu lại thấy vui khi trò chuyện cùng gia đình."]]},"9.12":{"t":"Choosing a Career","tv":"Chọn nghề nghiệp","s":[["Grade 9 is the time to think about the future.","Lớp 9 là lúc nghĩ về tương lai."],["At a career day, the four friends meet people with different jobs.","Trong một ngày hội hướng nghiệp, bốn bạn gặp những người làm các nghề khác nhau."],["An engineer explains that his work is challenging but rewarding.","Một kỹ sư chia sẻ rằng công việc của anh đầy thử thách nhưng rất bổ ích."],["A journalist says she often works overtime because of deadlines.","Một nhà báo kể rằng chị thường làm thêm giờ vì hạn chót."],["A chef talks about long shifts in a busy restaurant kitchen.","Một đầu bếp kể về những ca làm dài trong căn bếp nhà hàng đông khách."],["Minh wants to be a scientist, and Lan wants to be an architect.","Minh muốn trở thành nhà khoa học, còn Lan muốn làm kiến trúc sư."],["Nam is still not sure; he likes both programming and business.","Nam vẫn chưa chắc chắn, cậu thích cả lập trình lẫn kinh doanh."],["Mai has already decided: she will be a fashion designer and start her own company.","Mai đã quyết định: bạn ấy sẽ trở thành nhà thiết kế thời trang và mở công ty riêng."],["A manager gives them advice: “Don't choose a job only because it is well-paid.","Một vị quản lý khuyên các bạn: “Đừng chọn nghề chỉ vì lương cao."],["Choose work that you enjoy, and keep learning new skills.","Hãy chọn công việc mình yêu thích và không ngừng học kỹ năng mới."],["Your qualifications are important, but your attitude and experience matter more.”","Bằng cấp quan trọng, nhưng thái độ và kinh nghiệm còn quan trọng hơn.”"],["That night, Nam writes down his goal: find his dream job and achieve it.","Tối đó, Nam viết ra mục tiêu của mình: tìm ra công việc mơ ước và đạt được nó."]]},"N:Thời gian & Lịch":{"t":"A Busy Week","tv":"Một tuần bận rộn","s":[["Lan's week is always busy.","Tuần nào của Lan cũng bận rộn."],["On Monday morning, she gets up at half past five and is never late for school.","Sáng thứ Hai, bạn ấy dậy lúc năm rưỡi và chưa bao giờ đi học muộn."],["She usually has English club on Tuesday afternoon and piano lessons on Thursday evening.","Bạn ấy thường sinh hoạt câu lạc bộ tiếng Anh chiều thứ Ba và học piano tối thứ Năm."],["On Wednesday, she sometimes stays at school until six o'clock to finish a project.","Thứ Tư, thỉnh thoảng bạn ấy ở lại trường đến sáu giờ để làm xong dự án."],["She rarely watches TV during the week because she doesn't have time.","Bạn ấy hiếm khi xem ti vi trong tuần vì không có thời gian."],["On Friday night, she feels tired, but she is happy because the weekend is coming.","Tối thứ Sáu, bạn ấy thấy mệt nhưng vui vì cuối tuần sắp đến."],["On Saturday, she visits her grandparents, and on Sunday she always sleeps late.","Thứ Bảy, bạn ấy về thăm ông bà, còn Chủ nhật thì lúc nào cũng ngủ nướng."],["Her birthday is in May, and her exams are in June.","Sinh nhật bạn ấy vào tháng Năm, còn kỳ thi vào tháng Sáu."],["Recently, she has started to plan her time on a calendar.","Gần đây, bạn ấy đã bắt đầu lên kế hoạch thời gian trên lịch."],["She spends a few minutes every evening checking what she has to do tomorrow.","Mỗi tối bạn ấy dành vài phút xem ngày mai cần làm gì."],["Now she finishes her work early and still has time to relax.","Giờ bạn ấy làm xong việc sớm mà vẫn có thời gian thư giãn."]]},"N:Số, Màu sắc & Đo lường":{"t":"Mai's Dream Room","tv":"Căn phòng mơ ước của Mai","s":[["Mai wants to paint her bedroom, so she needs to measure it first.","Mai muốn sơn lại phòng ngủ nên trước hết cần đo đạc."],["The room is four metres long, three metres wide and about three metres high.","Căn phòng dài bốn mét, rộng ba mét và cao khoảng ba mét."],["She calculates the area of the floor: four times three equals twelve square metres.","Bạn ấy tính diện tích sàn: bốn nhân ba bằng mười hai mét vuông."],["She chooses a pale blue colour for the walls and a white ceiling.","Bạn ấy chọn màu xanh nhạt cho tường và trần màu trắng."],["Her little brother wants bright yellow, but Mai thinks it is too much.","Em trai bạn ấy muốn màu vàng tươi, nhưng Mai thấy như vậy quá chói."],["One litre of paint costs 120,000 dong, and she needs five litres.","Một lít sơn giá 120.000 đồng, và bạn ấy cần năm lít."],["That is 600,000 dong in total, so she asks her parents to pay half.","Tổng cộng là 600.000 đồng nên bạn ấy nhờ bố mẹ trả một nửa."],["She also buys a round mirror, a small square rug and three heavy boxes for her books.","Bạn ấy còn mua một chiếc gương tròn, một tấm thảm vuông nhỏ và ba chiếc hộp to nặng để đựng sách."],["After two days of hard work, her room looks bright and colourful.","Sau hai ngày làm việc vất vả, căn phòng trông sáng sủa và nhiều màu sắc."],["Her brother counts the stars she painted on the ceiling: there are fifty of them!","Em trai bạn ấy đếm những ngôi sao bạn ấy vẽ trên trần nhà: có năm mươi ngôi tất cả!"]]},"N:Mua sắm & Tiền bạc":{"t":"Nam's Piggy Bank","tv":"Con heo đất của Nam","s":[["Nam wants a new bike, but it costs three million dong.","Nam muốn có một chiếc xe đạp mới, nhưng nó giá ba triệu đồng."],["His parents say he must save money for it himself.","Bố mẹ bảo cậu phải tự tiết kiệm tiền để mua."],["He gets 100,000 dong of pocket money every week.","Mỗi tuần cậu được 100.000 đồng tiền tiêu vặt."],["Before, he spent it all on snacks and games, but now he makes a budget.","Trước đây cậu tiêu hết vào đồ ăn vặt và trò chơi, nhưng giờ cậu lập ngân sách."],["He puts half of it into his piggy bank every Sunday.","Chủ nhật nào cậu cũng bỏ một nửa vào con heo đất."],["He also sells his old comics and some second-hand toys online.","Cậu còn bán truyện tranh cũ và một số đồ chơi đã qua sử dụng trên mạng."],["Once, his friend wanted to borrow money, but Nam said no, because he didn't want any debt between them.","Có lần bạn muốn mượn tiền, nhưng Nam từ chối vì không muốn giữa hai đứa có nợ nần."],["After six months, he has saved two million dong.","Sau sáu tháng, cậu đã dành dụm được hai triệu đồng."],["His grandmother is proud of him and gives him the rest as a gift.","Bà rất tự hào về cậu và cho cậu số tiền còn thiếu làm quà."],["His mother opens a bank account for him and shows him how an e-wallet works.","Mẹ mở cho cậu một tài khoản ngân hàng và chỉ cậu cách dùng ví điện tử."],["Nam learns that the value of money is easier to understand when you earn it yourself.","Nam hiểu ra rằng giá trị của đồng tiền dễ thấm hơn khi mình tự làm ra nó."]]},"N:Động từ thông dụng":{"t":"The Lost Key","tv":"Chiếc chìa khóa bị mất","s":[["One afternoon, Minh comes home from school and can't find his key.","Một buổi chiều, Minh đi học về và không tìm thấy chìa khóa."],["He looks for it in his bag, in his pockets and under the doormat.","Cậu tìm trong cặp, trong túi và dưới tấm thảm chùi chân."],["He remembers that he put it on his desk at school, but he isn't sure.","Cậu nhớ là đã để nó trên bàn ở trường, nhưng không chắc lắm."],["He decides to call his mother, but she doesn't answer.","Cậu quyết định gọi cho mẹ, nhưng mẹ không nghe máy."],["So he sits on the stairs and waits.","Thế là cậu ngồi ở cầu thang chờ."],["Soon, his neighbour, Mrs Lan, notices him and asks what happened.","Một lúc sau, cô Lan hàng xóm để ý thấy và hỏi có chuyện gì."],["She invites him into her house and gives him some water and a cake.","Cô mời cậu vào nhà, cho cậu cốc nước và một chiếc bánh."],["At six o'clock, his mother arrives and opens the door.","Đến sáu giờ, mẹ cậu về và mở cửa."],["When Minh empties his bag, the key drops out of a small pocket!","Khi Minh dốc cặp ra, chiếc chìa khóa rơi ra từ một ngăn nhỏ!"],["He feels silly, but he thanks Mrs Lan and promises to be more careful.","Cậu thấy mình thật ngớ ngẩn, nhưng vẫn cảm ơn cô Lan và hứa sẽ cẩn thận hơn."],["Now he always keeps the key in the same place.","Giờ cậu luôn cất chìa khóa ở một chỗ cố định."]]},"N:Tính từ miêu tả":{"t":"The Old Wooden Box","tv":"Chiếc hộp gỗ cũ","s":[["In her grandmother's attic, Lan finds an old wooden box.","Trên gác mái nhà bà, Lan tìm thấy một chiếc hộp gỗ cũ."],["It is small and heavy, and the lid is a bit rough and dusty.","Nó nhỏ mà nặng, nắp hộp hơi thô ráp và bám bụi."],["Inside, there are some strange and beautiful things.","Bên trong có mấy món đồ lạ mà đẹp."],["There is a shiny silver ring, a soft silk scarf and a fragile glass bird.","Có một chiếc nhẫn bạc sáng bóng, một chiếc khăn lụa mềm mại và một chú chim thủy tinh dễ vỡ."],["At the bottom, there is a letter in neat handwriting.","Dưới đáy hộp có một lá thư với nét chữ gọn gàng."],["Lan is curious, but she knows it is wrong to read it without asking.","Lan rất tò mò, nhưng bạn ấy biết đọc thư mà không xin phép là không đúng."],["She shows the box to her grandmother.","Bạn ấy đưa chiếc hộp cho bà xem."],["Grandma smiles: “These are very precious to me. Your grandfather gave them to me when we were young.”","Bà mỉm cười: “Đây là những thứ rất quý với bà. Ông cháu tặng bà hồi ông bà còn trẻ.”"],["The things are not expensive, but they are valuable because of the memories.","Những món đồ ấy không đắt tiền, nhưng có giá trị vì chứa đựng kỷ niệm."],["Lan thinks it is the most special box in the whole house.","Lan nghĩ đó là chiếc hộp đặc biệt nhất trong cả ngôi nhà."]]},"N:Giới từ & Từ nối":{"t":"Where Is the Cat?","tv":"Con mèo ở đâu?","s":[["Mai's cat, Bông, often hides in strange places.","Con mèo Bông nhà Mai hay trốn ở những chỗ kỳ lạ."],["One morning, Mai can't find her anywhere.","Một buổi sáng, Mai tìm khắp nơi mà không thấy nó."],["She looks under the bed, behind the sofa and inside the wardrobe, but the cat isn't there.","Bạn ấy tìm dưới gầm giường, sau ghế sofa và trong tủ quần áo, nhưng con mèo không có ở đó."],["Then she runs outside and walks along the street, calling her name.","Rồi bạn ấy chạy ra ngoài, đi dọc con phố và gọi tên nó."],["Although she is very worried, she tries to stay calm.","Mặc dù rất lo, bạn ấy cố giữ bình tĩnh."],["Suddenly, she hears a quiet sound from above.","Bỗng nhiên, bạn ấy nghe một tiếng kêu khe khẽ từ phía trên."],["The cat is on the roof, between two plant pots!","Con mèo đang ở trên mái nhà, giữa hai chậu cây!"],["Mai can't climb up because it is too dangerous, so she asks her father for help.","Mai không trèo lên được vì quá nguy hiểm nên nhờ bố giúp."],["He carefully brings a ladder and gets the cat down.","Bố cẩn thận mang thang đến và đưa con mèo xuống."],["Finally, Bông is safe in Mai's arms, and everyone laughs together.","Cuối cùng, Bông đã an toàn trong vòng tay Mai, và cả nhà cùng bật cười."]]},"N:Giao tiếp & Xã hội":{"t":"The Class Debate","tv":"Buổi tranh luận của lớp","s":[["Ms Hoa asks the class a question: “Should students use phones at school?”","Cô Hoa đặt câu hỏi cho cả lớp: “Học sinh có nên dùng điện thoại ở trường không?”"],["Nam raises his hand first. “In my opinion, phones are useful for learning.”","Nam giơ tay đầu tiên. “Theo ý em, điện thoại rất hữu ích cho việc học.”"],["He gives an example: “We can look up words and do research quickly.”","Cậu đưa ra ví dụ: “Chúng ta có thể tra từ và tìm tài liệu rất nhanh.”"],["Mai disagrees politely: “I understand your point of view, but there is a disadvantage.","Mai lịch sự phản bác: “Mình hiểu quan điểm của bạn, nhưng có một nhược điểm."],["Many students play games instead of listening.”","Nhiều bạn chơi trò chơi thay vì nghe giảng.”"],["Minh is not sure. “Maybe phones have both advantages and disadvantages.”","Minh còn phân vân. “Có lẽ điện thoại vừa có ưu điểm vừa có nhược điểm.”"],["Lan suggests a solution: students can use phones only when the teacher allows it.","Lan đề xuất một giải pháp: học sinh chỉ được dùng điện thoại khi giáo viên cho phép."],["Everyone thinks it is a good suggestion.","Ai cũng thấy đó là một đề xuất hay."],["Ms Hoa says a good debate is not about winning the argument.","Cô Hoa nói một buổi tranh luận hay không phải là để thắng."],["It is about listening, giving reasons and respecting each other.","Mà là để lắng nghe, đưa ra lý lẽ và tôn trọng nhau."],["At the end, the class makes a decision together.","Cuối buổi, cả lớp cùng nhau đưa ra quyết định."]]}}};

function count(node){if(node.cnt!=null)return node.cnt;node.cnt=node.w?node.w.length:node.c.reduce((s,c)=>s+count(c),0);return node.cnt}
function words(node){return node.w?node.w.map(i=>W[i]):node.c.flatMap(words)}
function tag(node,trail,key){if(node.w)node.w.forEach(i=>{W[i].p[key]=trail.concat(node.n);if(key==='B'){W[i].h=node.h;W[i].gB=node}});else node.c.forEach(c=>tag(c,trail.concat(node===ROOTS[key]?[]:[node.n]),key))}
tag(ROOTS.A,[],'A');tag(ROOTS.B,[],'B');
function findGroup(node,i){if(node.w)return node.w.includes(i)?node:null;for(const c of node.c){const r=findGroup(c,i);if(r)return r}return null}

function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms||2200)}

let voice=null;
function pickVoice(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/Samantha|Google|Natural|Aria|Jenny/i.test(x.name))||v.find(x=>/en[-_](US|GB)/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,slow){if(!('speechSynthesis'in window)){toast('Trình xem này không có giọng đọc. Hãy mở app bằng Google Chrome để nghe phát âm.',6000);return}
  const vs=speechSynthesis.getVoices();if(vs.length&&!vs.some(x=>/^en/i.test(x.lang))){toast('Máy chưa có giọng tiếng Anh. Vào Cài đặt > Chuyển văn bản thành giọng nói, chọn Google và tải giọng English (US).',7000)}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=slow?.6:.9;speechSynthesis.speak(u)}

  $('#qGo').onclick=()=>{if(qz.mode==='speak'&&!SR){toast(NOSR,6000);return}let p=poolOf(qz.s1,qz.s2);if(qz.mode==='fill')p=p.filter(fillable);if(p.length<2){toast('Phạm vi này quá ít từ, chọn rộng hơn nhé');return}qz.key=key();qzStart(p)}}
function qzStart(src){qz.qs=shuffle(src).slice(0,Math.min(qz.n,src.length));qz.k=0;qz.score=0;qz.wrong=[];qz.started=true;qz.src=src;qzQ()}
function distract(w){const g=w.gB;let p=(g?g.w.map(i=>W[i]):[]).filter(o=>o.en!==w.en&&o.vi!==w.vi);if(p.length<3)p=W.filter(o=>o.en!==w.en&&o.vi!==w.vi);return shuffle(p).slice(0,3)}
function qzQ(){if(qz.mode==='speak')return qzSpeak();const b=$('#qzBody'),w=qz.qs[qz.k],opts=shuffle([w,...distract(w)]),m=qz.mode;
  let pr;
  if(m==='en')pr=`<div class="q">Nghĩa của từ này là gì?</div><div class="big">${esc(w.en)}</div><div class="ipa">/${esc(w.ipa)}/</div><button class="say" data-say style="--h:${w.h}">🔊 Nghe</button>`;
  else if(m==='vi')pr=`<div class="q">Từ tiếng Anh nào có nghĩa là</div><div class="mid">${esc(w.vi)}</div>`;
  else if(m==='ear')pr=`<div class="q">Nghe và chọn đúng từ</div><button class="say" data-say style="--h:${w.h};font-size:1.3rem;padding:14px 26px">🔊 Phát lại</button><div><button class="say" data-slow style="--h:${w.h}">🐢 Nghe chậm</button></div>`;
  else{const sent=esc(w.ex).replace(blankRe(w),'<span class="blank"></span>');pr=`<div class="q">Chọn từ đúng để điền vào chỗ trống</div><div class="sent">${sent}</div><div class="hintvi">Gợi ý: ${esc(w.vi)}</div>`}
  const enOpt=m!=='en';
  b.innerHTML=`<div class="fc-meta"><span>Câu ${qz.k+1} / ${qz.qs.length}</span><span>Đúng ${qz.score}</span></div><div class="prog"><i style="width:${qz.k/qz.qs.length*100}%"></i></div>
  <div class="prompt">${pr}</div><div class="opts">${opts.map((o,i)=>`<button class="opt ${enOpt?'en':''}" data-i="${i}"><span class="n">${'ABCD'[i]}</span><span>${esc(enOpt?o.en:o.vi)}</span></button>`).join('')}</div><div id="qNext"></div>`;
  b.querySelector('.prompt').onclick=e=>{if(e.target.closest('[data-say]'))speak(w.en);if(e.target.closest('[data-slow]'))speak(w.en,true)};
  if(m==='en'||m==='ear')speak(w.en);
  b.querySelector('.opts').onclick=e=>{const c=e.target.closest('.opt');if(!c||c.disabled)return;const ok=opts[+c.dataset.i]===w;
    b.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(opts[i]===w)x.classList.add('right')});if(!ok){c.classList.add('wrong');qz.wrong.push(w)}else qz.score++;
    speak(m==='fill'?w.ex:w.en);const last=qz.k===qz.qs.length-1;
    $('#qNext').innerHTML=`<div style="margin-top:12px;text-align:center;font-weight:600;color:${ok?'var(--ok)':'var(--bad)'}">${ok?'Chính xác!':'Đáp án đúng: '+esc(w.en)+' = '+esc(w.vi)}</div>
    <div class="exbox" style="--h:${w.h};margin-top:10px"><p><b>${esc(w.en)}</b> <span class="ipa">/${esc(w.ipa)}/</span><br>${esc(w.ex)}</p></div><button class="btn pri next" id="qNx">${last?'Xem kết quả':'Câu tiếp'}</button>`;
    $('#qNx').onclick=()=>{if(last)qzEnd();else{qz.k++;qzQ()}};$('#qNx').focus()}}
function qzSpeak(){const b=$('#qzBody'),w=qz.qs[qz.k];let att=0,bs=-1;const last=qz.k===qz.qs.length-1;
  b.innerHTML=`<div class="fc-meta"><span>Từ ${qz.k+1} / ${qz.qs.length}</span><span>Đạt ${qz.score}</span></div><div class="prog"><i style="width:${qz.k/qz.qs.length*100}%"></i></div>
  <div class="prompt" data-tipbox style="--h:${w.h}"><div class="q">Đọc to từ này</div><div class="big">${esc(w.en)}</div><div class="ipa">/${ipaHTML(w.ipa)}/</div><div class="phtip" hidden style="text-align:left"></div><div class="hintvi">${esc(w.vi)}</div>
  <div style="margin-top:10px"><button class="say" data-say>🔊 Nghe mẫu</button> <button class="say" data-slow>🐢 Chậm</button></div></div>
  <button class="mic big" id="qMic">🎤 Bấm rồi đọc to</button><div id="qSr"></div><div id="qNext"><button class="btn next" id="qSkip">Bỏ qua từ này</button></div>`;
  b.querySelector('.prompt').onclick=e=>{if(e.target.closest('[data-say]'))speak(w.en);if(e.target.closest('[data-slow]'))speak(w.en,true)};
  const next=()=>{if(bs>=70)qz.score++;else qz.wrong.push(w);if(last)qzEnd();else{qz.k++;qzQ()}};
  $('#qSkip').onclick=next;
  $('#qMic').onclick=()=>listen(w,$('#qSr'),res=>{if(!res)return;att++;if(res.score>bs)bs=res.score;
    $('#qMic').textContent=bs>=85?'🎤 Đọc lại lần nữa':'🎤 Nói lại';
    $('#qNext').innerHTML=`<div style="margin-top:8px;text-align:center;color:var(--muted);font-size:.88rem">Lần ${att} · điểm tốt nhất ${bs}/100${bs<70?' · cần từ 70 điểm để tính đạt':''}</div><button class="btn pri next" id="qNx">${last?'Xem kết quả':'Từ tiếp theo'}</button>`;
    $('#qNx').onclick=next})}
function qzEnd(){const pct=Math.round(qz.score/qz.qs.length*100);if(best[qz.key]==null||pct>best[qz.key]){best[qz.key]=pct;try{localStorage.setItem('vbest2',JSON.stringify(best))}catch(e){}}
  const msg=pct===100?'Xuất sắc, không sai câu nào!':pct>=80?'Rất tốt, ôn nốt vài từ sai nhé.':pct>=50?'Khá ổn, luyện thêm một lượt nữa.':'Cần ôn thêm, thử Thẻ từ trước rồi đố lại.';
  $('#qzBody').innerHTML=`<div class="end" style="text-align:center"><h2>Kết quả</h2><div class="score">${qz.score}/${qz.qs.length}</div><p>${msg}</p></div>
  ${qz.wrong.length?`<h3 style="font-family:var(--disp);margin:18px 0 0">Từ cần ôn</h3><ul class="wrongs">${qz.wrong.map((w,i)=>`<li><span><b>${esc(w.en)}</b> <span class="ipa">/${esc(w.ipa)}/</span><br><span style="color:var(--muted)">${esc(w.vi)}</span></span><button data-i="${i}" aria-label="Nghe ${esc(w.en)}">🔊</button></li>`).join('')}</ul>`:''}
  <div class="row">${qz.wrong.length?'<button class="btn pri" id="qRe" style="flex:1">Đố lại câu sai</button>':''}<button class="btn ${qz.wrong.length?'':'pri'}" id="qAg" style="flex:1">Lượt mới</button></div>
  <button class="btn next" id="qSet">Đổi phạm vi</button>`;
  const ul=$('#qzBody .wrongs');if(ul)ul.onclick=e=>{const c=e.target.closest('[data-i]');if(c)speak(qz.wrong[+c.dataset.i].en)};
  if($('#qRe'))$('#qRe').onclick=()=>{qz.qs=shuffle(qz.wrong.slice());qz.k=0;qz.score=0;qz.wrong=[];qzQ()};
  $('#qAg').onclick=()=>qzStart(qz.src);$('#qSet').onclick=qzSetup}
function ipaView(){const b=$('#ipaBody');if(b.dataset.done)return;b.dataset.done=1;
  const cnt={};W.forEach(w=>{w.tk=w.tk||tokenize(w.ipa);new Set(w.tk).forEach(t=>{if(PHM[t])cnt[t]=(cnt[t]||0)+1})});
  const sec=(k,title,sub)=>`<h2 class="ih">${title}</h2><p class="isub">${sub}</p><div class="igrid">${PH.filter(p=>p[2]===k).map(p=>`<div class="icard">
    <div class="isym"><span>/${esc(p[0])}/</span>${p[1]!==p[0]?`<span class="iuk">SGK (giọng Anh): /${esc(p[1])}/</span>`:''}</div>
    <p>${esc(p[3])}</p><div>${p[4].map(e=>`<button class="exw" data-w="${esc(e)}">🔊 ${esc(e)}</button>`).join('')}</div>
    ${cnt[p[0]]?`<button class="ilist" data-s="${esc(p[0])}">Xem và luyện ${cnt[p[0]]} từ có âm này ›</button>`:''}</div>`).join('')}</div>`;
  const ex=(ws)=>ws.map(e=>`<button class="exw" data-w="${esc(e)}">🔊 ${esc(e)}</button>`).join('');
  b.innerHTML=`<div class="iintro"><p><b>Cách đọc phiên âm trong app.</b> Phiên âm và giọng đọc 🔊 theo giọng Mỹ. SGK Global Success in phiên âm giọng Anh; chỗ nào hai giọng ghi khác nhau thì góc thẻ có ghi ký hiệu của SGK.</p>
  <p><b>ˈ</b> trọng âm chính: nhấn mạnh âm tiết ngay sau dấu này (teacher /ˈtitʃər/ nhấn “tea”). <b>ˌ</b> trọng âm phụ, nhấn nhẹ hơn. Dấu <b>ː</b> trong SGK nghĩa là âm dài.</p>
  <p>Ở mỗi từ, chạm vào từng ký hiệu trong phiên âm để xem cách đọc âm đó, và bấm <b>🎤 Nói thử</b> để app chấm.</p>
  <button class="mic" id="goSpeak">🎤 Vào luyện nói ngay</button></div>
  <h2 class="ih">6 lỗi người Việt hay mắc</h2><ol class="mist">
  <li><b>Bỏ âm cuối.</b> Đọc rõ /t/, /d/, /s/, /z/, /k/ ở cuối từ. ${ex(['cat','bed','bus','dogs','book'])}</li>
  <li><b>Đọc /θ/, /ð/ thành “th”, “d”.</b> Đưa đầu lưỡi ra giữa hai răng. ${ex(['think','three','this','mother'])}</li>
  <li><b>Lẫn /ʃ/ và /s/.</b> she khác see, ship khác sip. ${ex(['she','see','ship','sip'])}</li>
  <li><b>Đọc /v/ thành “d” hoặc “b”.</b> Răng trên chạm môi dưới. ${ex(['very','five','vegetable'])}</li>
  <li><b>Đọc /æ/ thành “a”.</b> Há miệng to nhưng khẩu hình “e”. ${ex(['cat','bag','apple'])}</li>
  <li><b>Không nhấn trọng âm.</b> Mỗi từ nhiều âm tiết luôn có một âm tiết nhấn mạnh. ${ex(['teacher','about','computer','banana'])}</li></ol>
  ${sec('v','Nguyên âm đơn','12 âm, phần “hồn” của mỗi từ.')}${sec('d','Nguyên âm đôi','Trượt từ âm đầu sang âm sau trong một hơi.')}${sec('c','Phụ âm','24 âm. Chú ý các âm không có trong tiếng Việt: /θ/, /ð/, /ʃ/, /ʒ/, /dʒ/, /v/, /z/.')}`;
  $('#goSpeak').onclick=()=>{document.querySelector('nav button[data-v=qz]').click();qz.mode='speak';qzSetup()};
  b.onclick=e=>{const l=e.target.closest('.ilist');if(l)openList(l.dataset.s)}}
function openList(sym){const ws=W.filter(w=>(w.tk||(w.tk=tokenize(w.ipa))).includes(sym)).sort((a,b)=>a.en.length-b.en.length);const s=$('#sheet');s.style.setProperty('--h',210);
  s.innerHTML=`<div class="path">Âm /${esc(sym)}/ · ${ws.length} từ</div><div class="phtip">${phTip(sym)}</div>
  <button class="mic" id="lSpeak">🎤 Luyện nói 10 từ có âm này</button>
  <div class="wlist">${ws.slice(0,80).map(w=>`<button data-i="${w.i}"><span><b>${esc(w.en)}</b> <span class="ipa">/${esc(w.ipa)}/</span></span><span class="uvi">${esc(w.vi)}</span></button>`).join('')}</div>
  <button class="btn next" id="lClose">Đóng</button>`;
  $('#veil').classList.add('on');
  s.querySelector('.wlist').onclick=e=>{const c=e.target.closest('[data-i]');if(c)openWord(W[+c.dataset.i])};
  $('#lClose').onclick=closeSheet;
  $('#lSpeak').onclick=()=>{if(!SR){toast(NOSR,6000);return}closeSheet();document.querySelector('nav button[data-v=qz]').click();qz.mode='speak';qz.key='ipa_'+sym;qz.n=10;qzStart(shuffle(ws).slice(0,10))}}
go([]);
</script>
