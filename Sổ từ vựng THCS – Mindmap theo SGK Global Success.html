<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ từ vựng THCS – Mindmap theo SGK Global Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#F6F8F2;--grid:#DCE6EC;--ink:#1D2A3A;--muted:#5D6A78;--accent:#2B57B5;--surface:#FFFFFF;--line:#D3DCE3;
  --ok:#1E8A4C;--bad:#C2392B;--s:62%;--l:44%;--tint:91%;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15201B;--grid:#1F2C26;--ink:#E8EDE3;--muted:#9BA89F;--accent:#9DBBFF;--surface:#1C2923;--line:#2C3B34;
  --ok:#5BD08C;--bad:#FF8A7A;--l:67%;--tint:21%;}}
:root[data-theme="dark"]{
  --paper:#15201B;--grid:#1F2C26;--ink:#E8EDE3;--muted:#9BA89F;--accent:#9DBBFF;--surface:#1C2923;--line:#2C3B34;
  --ok:#5BD08C;--bad:#FF8A7A;--l:67%;--tint:21%;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:var(--ui);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px;max-width:900px;width:100%;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--disp);font-weight:800;font-size:1.6rem;line-height:1;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--ui);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:6px;letter-spacing:0}
.known{font-size:.82rem;color:var(--muted);white-space:nowrap}
.known b{color:var(--ink)}
.search{position:relative}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1rem}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  max-height:55vh;overflow:auto;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.results button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:10px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.results button span:first-child{font-family:var(--disp);font-weight:700;font-size:1.05rem}
.results button span:last-child{color:var(--muted);font-size:.9rem;text-align:right}
.results p{margin:0;padding:12px 14px;color:var(--muted)}
main{flex:1;min-height:0;position:relative;max-width:900px;width:100%;margin:0 auto}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
/* mindmap */
.crumbs .chip{margin-left:auto;padding:5px 10px;font-size:.8rem}
.crumbs{display:flex;align-items:center;gap:4px;padding:0 96px 6px 16px;min-height:40px;flex-wrap:wrap;font-size:.9rem}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:8px;color:var(--accent);font-weight:600}
.crumbs span.cur{padding:4px 6px;font-weight:700}
.crumbs i{color:var(--muted);font-style:normal}
.mapwrap{flex:1;min-height:0;overflow:auto;position:relative;touch-action:pan-x pan-y}
.mapwrap svg{display:block;width:100%;height:auto;margin:0 auto}
.zoom{position:absolute;right:12px;top:0;display:flex;gap:6px;z-index:5}
.zoom button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.1rem;font-weight:700;line-height:1}
.hint{position:absolute;left:16px;bottom:14px;font-size:.8rem;color:var(--muted);background:var(--paper);padding:4px 8px;border-radius:8px;pointer-events:none}
svg text{fill:var(--ink);font-family:var(--ui)}
.br{fill:none;stroke:hsl(var(--h) var(--s) var(--l));stroke-linecap:round}
.nd{cursor:pointer}
.nd .bub{fill:hsl(var(--h) 75% var(--tint));stroke:hsl(var(--h) var(--s) var(--l));stroke-width:3}
.nd:hover .bub,.nd:focus .bub{stroke-width:5}
.nd:focus{outline:none}
.nd:focus-visible .bub{stroke:var(--accent);stroke-width:6}
.ctr{fill:var(--ink)}
.ctrt{fill:var(--paper)!important;font-family:var(--disp)!important;font-weight:800}
.lbl{font-weight:600;font-size:21px;paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.wd{font-family:var(--disp)!important;font-weight:700;font-size:25px;cursor:pointer}
.wd.k{fill:hsl(var(--h) var(--s) var(--l))}
.leaf{paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;font-size:19px;fill:var(--muted)!important;font-family:var(--disp)!important;font-weight:500}
.dot{fill:var(--paper);stroke:hsl(var(--h) var(--s) var(--l));stroke-width:3}
.dot.k{fill:hsl(var(--h) var(--s) var(--l))}
/* controls */
.bar{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
select{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.92rem;max-width:100%;flex:1;min-width:0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 16px 24px}
/* flashcards */
.fc-meta{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;color:var(--muted);margin:4px 0 10px}
.card{perspective:1200px;height:min(46vh,320px);margin:0 auto;max-width:520px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--surface);
  border:2px solid hsl(var(--h) var(--s) var(--l));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;
  box-shadow:6px 6px 0 hsl(var(--h) var(--s) var(--l))}
.back{transform:rotateY(180deg)}
.face .big{font-family:var(--disp);font-weight:800;font-size:clamp(2rem,9vw,3.2rem);line-height:1.05;overflow-wrap:anywhere}
.face .mid{font-size:clamp(1.3rem,5.5vw,1.8rem);font-weight:600;line-height:1.25}
.face .sub{margin-top:10px;color:var(--muted);font-size:.85rem}
.face .tap{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.say{margin-top:14px;border:0;border-radius:999px;padding:8px 16px;background:hsl(var(--h) 75% var(--tint));font-weight:700;font-size:.95rem}
.fc-actions{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px;max-width:520px;margin:16px auto 0}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;font-weight:700;font-size:.95rem}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.okb{border-color:var(--ok);color:var(--ok)}
.btn.nob{border-color:var(--bad);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* quiz */
.qwrap{max-width:560px;margin:0 auto}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prompt{background:var(--surface);border:2px solid var(--ink);border-radius:20px;padding:22px 16px;text-align:center;box-shadow:5px 5px 0 var(--ink);margin-bottom:16px}
.prompt .big{font-family:var(--disp);font-weight:800;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.1}
.prompt .mid{font-size:1.35rem;font-weight:600}
.prompt .q{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;font-size:1.05rem;font-weight:600;display:flex;gap:10px;align-items:center}
.opt .n{flex:0 0 28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:.85rem}
.opt.en{font-family:var(--disp);font-size:1.25rem}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt:disabled{cursor:default}
.next{width:100%;margin-top:14px}
.setup h2,.end h2{font-family:var(--disp);font-weight:800;font-size:1.5rem;margin:6px 0 4px}
.setup p{color:var(--muted);margin:0 0 14px}
.field{margin-bottom:14px}
.field>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.score{font-family:var(--disp);font-weight:800;font-size:4rem;line-height:1;margin:10px 0}
.wrongs{list-style:none;padding:0;margin:14px 0}
.wrongs li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wrongs b{font-family:var(--disp);font-size:1.15rem}
.wrongs button{border:0;background:none;font-size:1.2rem}
/* tabs */
nav{display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1.5px solid var(--line)}
nav button{flex:1;max-width:200px;border:0;background:none;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;font-weight:600;color:var(--muted)}
nav button .ic{font-size:1.3rem;line-height:1}
nav button[aria-selected="true"]{color:var(--ink);background:var(--paper)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;z-index:40;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
  border-top:6px solid hsl(var(--h) var(--s) var(--l));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .path{font-size:.82rem;color:var(--muted)}
.sheet .big{font-family:var(--disp);font-weight:800;font-size:2.6rem;line-height:1.05;margin:6px 0 2px;overflow-wrap:anywhere}
.sheet .mean{font-size:1.3rem;font-weight:600;margin-bottom:16px}
.sheet .row button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:60;display:none}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.sheet{animation:none}}
@media (min-width:700px){h1{font-size:2rem}}

.toast{max-width:min(92vw,460px);text-align:center;line-height:1.4}
.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ipa{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",system-ui,sans-serif;color:var(--muted);font-size:1.05rem}
.exbox{background:var(--paper);border-left:4px solid hsl(var(--h) var(--s) var(--l));border-radius:10px;padding:10px 12px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.exbox p{margin:0;font-size:1.02rem;line-height:1.45;flex:1}
.exbox button{border:0;background:hsl(var(--h) 75% var(--tint));border-radius:999px;padding:6px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.face .ex{margin-top:12px;font-size:.98rem;line-height:1.4;color:var(--ink);max-width:420px}
.face .ipa{margin-top:4px}
.results .ipa{font-size:.85rem;margin-left:6px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);margin:0 4px}
.prompt .sent{font-size:1.25rem;line-height:1.5;font-weight:600}
.prompt .hintvi{margin-top:8px;color:var(--muted);font-size:.92rem}
.uvi{color:var(--muted);font-weight:500}

.sheet{max-height:88vh;overflow:auto}
.ph{border:0;background:none;padding:0 1px;margin:0;font:inherit;color:inherit;border-bottom:2px dotted hsl(var(--h) var(--s) var(--l));cursor:pointer}
.tapnote{font-size:.72rem;color:var(--muted);font-family:var(--ui);margin-left:6px}
.phtip{background:var(--paper);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem;line-height:1.55}
.exw{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-family:var(--disp);font-weight:700;margin:2px 2px 2px 0}
.mic{width:100%;border:0;border-radius:14px;padding:13px;background:var(--accent);color:var(--paper);font-weight:700;font-size:1rem}
.mic.big{padding:18px;font-size:1.15rem;margin-top:14px}
.srlive{padding:12px;text-align:center;font-weight:600}
.pulse{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);margin-right:8px;animation:pl 1s infinite;vertical-align:middle}
@keyframes pl{50%{opacity:.25}}
.srmsg{padding:10px 12px;margin-top:8px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));font-size:.9rem;line-height:1.45}
.srres{margin-top:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.srtop{display:flex;gap:10px;align-items:center}.srtop>div{flex:1}.srem{font-size:2rem}
.srlb{font-weight:800;font-family:var(--disp);font-size:1.2rem}
.srbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.srbar i{display:block;height:100%}
.srheard{margin-top:8px;color:var(--muted);font-size:.92rem}
.srhint{margin:8px 0 0;padding-left:18px;font-size:.9rem;line-height:1.5}
.ih{font-family:var(--disp);font-size:1.35rem;margin:20px 0 2px}.isub{color:var(--muted);margin:0 0 10px;font-size:.9rem}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.icard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.isym{font-size:1.6rem;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;font-family:"Charis SIL","Doulos SIL","Segoe UI",system-ui,sans-serif}
.iuk{font-size:.8rem;color:var(--muted);font-weight:500;font-family:var(--ui)}
.icard p{margin:6px 0 8px;font-size:.92rem;line-height:1.45}
.ilist{margin-top:8px;border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:.9rem}
.iintro{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;line-height:1.55;font-size:.93rem}
.iintro p{margin:0 0 8px}
.mist{padding-left:18px;line-height:1.5;font-size:.93rem}.mist li{margin-bottom:8px}
.wlist button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;text-align:left}
.wlist b{font-family:var(--disp);font-size:1.05rem}

.vw{border:0;background:hsl(var(--h) 75% var(--tint));color:inherit;font:inherit;padding:0 3px;border-radius:5px;font-weight:700;cursor:pointer;border-bottom:2px solid hsl(var(--h) var(--s) var(--l))}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.ritem{text-align:left;border:1.5px solid var(--line);border-left:6px solid hsl(var(--h) var(--s) var(--l));background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ritem b{font-family:var(--disp);font-size:1.08rem;line-height:1.2}
.rn{font-size:.78rem;color:var(--muted);font-weight:600}
.rhead{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:14px;margin:10px 0 14px;box-shadow:5px 5px 0 hsl(var(--h) var(--s) var(--l))}
.rhead h2{font-family:var(--disp);font-size:1.6rem;line-height:1.15;margin:4px 0 2px}
.rmeta{font-size:.82rem;color:var(--muted);margin-top:6px}
.rtext{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 14px}
.sen{padding:8px 6px;border-radius:10px;cursor:pointer;border-bottom:1px dashed var(--line)}
.sen:last-child{border-bottom:0}
.sen.on{background:hsl(var(--h) 75% var(--tint))}
.sen .en{margin:0;font-size:1.12rem;line-height:1.6}
.sen .vi{margin:4px 0 0;color:var(--muted);font-size:.95rem;line-height:1.45}
.sact{margin-top:8px}
.sact .say{margin-top:4px}
.instory{background:var(--paper);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:.98rem;line-height:1.5}
.instory .lb{font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.instory .vi{color:var(--muted);font-size:.9rem;margin-top:4px}
.instory .lk{border:0;background:none;color:var(--accent);font-weight:700;padding:0;margin-top:6px}
nav button{font-size:.74rem}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Sổ từ vựng<small id="total"></small></h1>
    <div class="known">Đã thuộc <b id="kc">0</b></div>
  </div>
  <div class="seg" role="group" aria-label="Cách sắp xếp">
    <button id="mA" aria-pressed="true">Theo SGK lớp 6–9</button>
    <button id="mB" aria-pressed="false">Theo chủ đề</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt" autocomplete="off" aria-label="Tìm từ">
    <div class="results" id="res" hidden></div>
  </div>
</header>
<main>
  <section class="view on" id="v-map" aria-label="Sơ đồ">
    <div class="crumbs" id="crumbs"></div>
    <div class="mapwrap" id="mapwrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="zoom"><button id="zin" aria-label="Phóng to">+</button><button id="zout" aria-label="Thu nhỏ">−</button></div>
    <div class="hint" id="hint"></div>
  </section>
  <section class="view" id="v-fc" aria-label="Thẻ từ">
    <div class="bar"><select id="fc1" aria-label="Phạm vi"></select><select id="fc2" aria-label="Phạm vi con"></select></div>
    <div class="bar">
      <button class="chip" id="fcDir" aria-pressed="false">Mặt trước: tiếng Anh</button>
      <button class="chip" id="fcUn" aria-pressed="false">Chỉ từ chưa thuộc</button>
      <button class="chip" id="fcMix">Trộn thẻ</button>
    </div>
    <div class="scroll" id="fcBody"></div>
  </section>
  <section class="view" id="v-qz" aria-label="Đố vui">
    <div class="scroll"><div class="qwrap" id="qzBody"></div></div>
  </section>
  <section class="view" id="v-rd" aria-label="Bài đọc"><div class="scroll"><div id="rdBody" style="max-width:760px;margin:0 auto"></div></div></section>
  <section class="view" id="v-ipa" aria-label="Phát âm"><div class="scroll"><div id="ipaBody" style="max-width:900px;margin:0 auto"></div></div></section>
</main>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-v="map"><span class="ic">🗺️</span>Sơ đồ</button>

 tầng hai, cạnh thư viện và phòng thí nghiệm."],["His teacher, Ms Hoa, writes the timetable on the board.","Cô giáo chủ nhiệm, cô Hoa, viết thời khóa biểu lên bảng."],["This term, they will study maths, literature, English, history, geography, science and informatics.","Học kỳ này các bạn sẽ học toán, ngữ văn, tiếng Anh, lịch sử, địa lý, khoa học và tin học."],["Minh's favourite subject is science because he loves doing experiments.","Môn Minh thích nhất là khoa học vì cậu mê làm thí nghiệm."],["At break, he plays football in the schoolyard and meets a girl called Lan.","Giờ ra chơi, cậu đá bóng ở sân trường và làm quen một bạn gái tên Lan."],["Lan lends him a pencil and a rubber because he forgot his.","Lan cho cậu mượn một cây bút chì và cục tẩy vì cậu quên mang."],["They have lunch together in the canteen and laugh a lot.","Hai bạn ăn trưa cùng nhau ở căng tin và cười rất nhiều."],["In the afternoon, Lan is chosen as class monitor.","Buổi chiều, Lan được chọn làm lớp trưởng."],["When Minh goes home, he tells his mother: “My new school is great!”","Khi về nhà, Minh kể với mẹ: “Trường mới của con tuyệt lắm!”"]]},"6.2":{"t":"A Visit to Lan's House","tv":"Đến thăm nhà Lan","s":[["On Sunday, Minh visits Lan's house for the first time.","Chủ nhật, Minh đến thăm nhà Lan lần đầu tiên."],["Lan lives in a small house with a garden and a red gate.","Lan sống trong một ngôi nhà nhỏ có vườn và cánh cổng màu đỏ."],["Her family has five people: her father, her mother, her grandmother, her little brother and Lan.","Gia đình Lan có năm người: bố, mẹ, bà nội, em trai và Lan."],["In the living room, there is a big sofa, an armchair and a clock on the wall.","Trong phòng khách có một bộ ghế sofa lớn, một chiếc ghế bành và một chiếc đồng hồ trên tường."],["Her grandmother is sitting in the armchair and reading a newspaper.","Bà của Lan đang ngồi trên ghế bành đọc báo."],["The kitchen is next to the dining room, and it smells wonderful.","Nhà bếp nằm cạnh phòng ăn và tỏa mùi thơm phức."],["Lan's mother is cooking soup in a big pot on the cooker.","Mẹ Lan đang nấu canh trong một chiếc nồi to trên bếp."],["Upstairs, Lan shares a bedroom with her cousin when she stays over.","Trên lầu, Lan ở chung phòng ngủ với chị họ mỗi khi chị ấy đến chơi."],["Her room has a bed, a wardrobe, a desk and a bookshelf full of comics.","Phòng của Lan có một cái giường, một tủ quần áo, một bàn học và một giá sách đầy truyện tranh."],["There is a mirror on the door and a lamp near the window.","Có một tấm gương trên cửa và một chiếc đèn gần cửa sổ."],["From the balcony, they can see the whole street.","Từ ban công, hai bạn nhìn được cả con phố."],["At dinner, everyone eats rice with chopsticks and talks about school.","Bữa tối, mọi người ăn cơm bằng đũa và trò chuyện về chuyện ở trường."],["Minh thinks Lan's home is small but very warm.","Minh thấy nhà Lan tuy nhỏ nhưng rất ấm cúng."]]},"6.3":{"t":"Three Different Friends","tv":"Ba người bạn khác nhau","s":[["Minh has three close friends, and each one is different.","Minh có ba người bạn thân, mỗi người một vẻ."],["Lan is tall and slim, with long straight hair.","Lan cao và mảnh mai, tóc dài thẳng."],["She is clever, hard-working and very responsible, so she is a good class monitor.","Bạn ấy thông minh, chăm chỉ và rất có trách nhiệm nên là một lớp trưởng giỏi."],["Nam is short and a little overweight, with curly hair and a cute smile.","Nam thấp và hơi thừa cân, tóc xoăn và có nụ cười dễ thương."],["He is funny and outgoing, but sometimes he is a bit lazy and talkative in class.","Cậu ấy hài hước và hướng ngoại, nhưng đôi khi hơi lười và nói nhiều trong lớp."],["Mai is quiet and shy, but she is very kind and creative.","Mai trầm lặng và nhút nhát, nhưng rất tốt bụng và sáng tạo."],["She draws beautiful pictures and is always helpful to everyone.","Bạn ấy vẽ tranh đẹp và luôn sẵn lòng giúp đỡ mọi người."],["Last week, Nam was rude to Mai, and she felt sad.","Tuần trước Nam nói năng thô lỗ với Mai khiến bạn ấy buồn."],["Lan was brave and honest; she told Nam that his attitude was wrong.","Lan dũng cảm và thẳng thắn nói với Nam rằng thái độ của cậu là sai."],["Nam was not stubborn. He said sorry, and Mai forgave him.","Nam không bướng bỉnh. Cậu xin lỗi và Mai đã bỏ qua cho cậu."],["Minh learned that a good friend is not perfect, but loyal and caring.","Minh hiểu ra rằng một người bạn tốt không cần hoàn hảo, mà cần trung thành và biết quan tâm."],["Appearance is not important; personality is what matters.","Ngoại hình không quan trọng, tính cách mới là điều đáng quý."]]},"6.4":{"t":"Where Is the Post Office?","tv":"Bưu điện ở đâu?","s":[["Minh's neighbourhood is busy but friendly.","Khu phố của Minh nhộn nhịp nhưng thân thiện."],["There is a market, a bakery, a pharmacy and a small café on his street.","Trên phố nhà cậu có một khu chợ, một tiệm bánh, một nhà thuốc và một quán cà phê nhỏ."],["One day, a tourist stops him at the bus stop and asks, “Excuse me, where is the post office?”","Một hôm, một du khách gọi cậu ở trạm xe buýt và hỏi: “Xin lỗi, bưu điện ở đâu vậy?”"],["Minh looks at the map on her phone and gives her directions.","Minh nhìn bản đồ trên điện thoại của cô ấy và chỉ đường."],["“Go straight along this road to the crossroads.","“Cô đi thẳng theo con đường này đến ngã tư."],["Then turn left at the traffic lights and cross at the zebra crossing.","Sau đó rẽ trái ở chỗ đèn giao thông và băng qua vạch sang đường."],["Walk past the cinema and the museum.","Đi qua rạp chiếu phim và bảo tàng."],["The post office is on the corner, opposite the park and next to the bank.”","Bưu điện nằm ở góc phố, đối diện công viên và cạnh ngân hàng.”"],["The tourist thanks him and smiles.","Du khách cảm ơn cậu và mỉm cười."],["Later, Minh walks to the bookshop near the pagoda to buy a new comic.","Sau đó, Minh đi bộ đến hiệu sách gần chùa để mua một cuốn truyện tranh mới."],["He loves his neighbourhood because everything is near, and the people are kind.","Cậu yêu khu phố của mình vì cái gì cũng gần và mọi người đều tốt bụng."]]},"6.5":{"t":"A Trip to Ha Long Bay","tv":"Chuyến đi Vịnh Hạ Long","s":[["In the summer, Minh's class goes on a trip to Ha Long Bay.","Mùa hè, lớp Minh đi tham quan Vịnh Hạ Long."],["The bay has nearly two thousand islands made of rock.","Vịnh có gần hai nghìn hòn đảo bằng đá."],["They take a boat across the blue sea and visit a huge cave.","Các bạn đi thuyền trên mặt biển xanh và tham quan một hang động khổng lồ."],["Inside the cave, the rocks look like animals and dragons.","Trong hang, những khối đá trông như các con vật và rồng."],["In the afternoon, they swim at a beach with soft white sand.","Buổi chiều, các bạn tắm ở một bãi biển cát trắng mịn."],["Ms Hoa tells them about other natural wonders of Viet Nam.","Cô Hoa kể cho các bạn nghe về những kỳ quan thiên nhiên khác của Việt Nam."],["In the north, there are high mountains like Fansipan and green valleys.","Ở miền Bắc có những ngọn núi cao như Fansipan và các thung lũng xanh mướt."],["In the centre, Phong Nha has a long river that flows through a cave.","Ở miền Trung, Phong Nha có một con sông dài chảy xuyên qua hang động."],["In the south, the Mekong Delta has rice fields, rivers and many ponds.","Ở miền Nam, đồng bằng sông Cửu Long có ruộng lúa, sông ngòi và nhiều ao hồ."],["Lan says, “Our country is so beautiful. We must keep it clean.”","Lan nói: “Đất nước mình đẹp quá. Mình phải giữ cho nó sạch.”"],["Everyone agrees and picks up the rubbish on the beach before leaving.","Ai cũng đồng ý và cùng nhặt rác trên bãi biển trước khi về."]]},"6.6":{"t":"Tet at Grandma's House","tv":"Tết ở nhà bà","s":[["Tet, or the Lunar New Year, is the biggest festival in Viet Nam.","Tết, hay Tết Nguyên Đán, là lễ hội lớn nhất ở Việt Nam."],["A week before Tet, Minh's family cleans and decorates the house.","Một tuần trước Tết, gia đình Minh dọn dẹp và trang trí nhà cửa."],["His father buys a kumquat tree, and his mother buys peach blossoms.","Bố cậu mua một cây quất, còn mẹ mua những cành hoa đào."],["In the south, people often choose yellow apricot blossoms.","Ở miền Nam, người ta thường chọn hoa mai vàng."],["On the last days of the year, the family makes banh chung together.","Những ngày cuối năm, cả nhà cùng nhau gói bánh chưng."],["On New Year's Eve, they watch fireworks and make a wish.","Đêm Giao thừa, mọi người xem pháo hoa và cầu một điều ước."],["They also worship their ancestors and pray for good luck and good health.","Họ cũng thờ cúng tổ tiên và cầu mong may mắn, sức khỏe."],["On the first day of Tet, Minh visits his grandparents.","Mùng một Tết, Minh đến thăm ông bà."],["He wishes them a long life, and they give him lucky money in a red envelope.","Cậu chúc ông bà sống lâu, và ông bà lì xì cho cậu trong phong bao đỏ."],["In the street, children watch a lion dance and a colourful parade.","Ngoài đường, trẻ em xem múa lân và đoàn diễu hành đầy màu sắc."],["Minh thinks Tet is the best celebration of the year because the whole family is together.","Minh nghĩ Tết là dịp vui nhất trong năm vì cả gia đình được đoàn tụ."]]},"6.7":{"t":"Too Much Screen Time?","tv":"Xem màn hình quá nhiều?","s":[["Nam loves television, and he watches it every evening.","Nam rất mê ti vi, tối nào cậu cũng xem."],["His favourite programme is a live football match on national television.","Chương trình cậu thích nhất là trận bóng đá truyền hình trực tiếp trên đài quốc gia."],["He also likes a funny game show with a clever MC.","Cậu cũng thích một trò chơi truyền hình vui nhộn có anh dẫn chương trình rất hóm hỉnh."],["His mother prefers the news and the weatherman's forecast.","Mẹ cậu thì thích xem thời sự và bản tin thời tiết."],["One day, Nam's teacher talks about screen time.","Một hôm, cô giáo của Nam nói về thời gian dùng màn hình."],["She says some programmes are educational and useful, but some are useless.","Cô nói có những chương trình mang tính giáo dục và hữu ích, nhưng cũng có những chương trình vô bổ."],["Too many advertisements can also make viewers buy things they don't need.","Quá nhiều quảng cáo cũng có thể khiến người xem mua những thứ không cần thiết."],["She also warns them about fake news and cyberbullying online.","Cô cũng cảnh báo về tin giả và nạn bắt nạt trên mạng."],["“Don't believe every headline,” she says. “Check the information first.”","“Đừng tin mọi tiêu đề,” cô nói. “Hãy kiểm tra thông tin trước đã.”"],["Nam realizes he is almost addicted to the screen.","Nam nhận ra mình gần như nghiện màn hình."],["Now he watches TV for one hour a day and reads a magazine or the newspaper instead.","Giờ cậu chỉ xem ti vi một tiếng mỗi ngày, thời gian còn lại đọc tạp chí hoặc báo."]]},"6.8":{"t":"The School Sports Day","tv":"Ngày hội thể thao của trường","s":[["Every year, Hoa Sen School has a big sports day.","Năm nào trường Hoa Sen cũng tổ chức một ngày hội thể thao lớn."],["Students compete in football, badminton, table tennis, chess and running.","Học sinh thi đấu bóng đá, cầu lông, bóng bàn, cờ vua và chạy bộ."],["Minh is the captain of the class football team.","Minh là đội trưởng đội bóng đá của lớp."],["Before the match, the players warm up and stretch on the pitch.","Trước trận đấu, các cầu thủ khởi động và giãn cơ trên sân."],["Their opponent is class 6B, a very strong team.","Đối thủ là lớp 6B, một đội rất mạnh."],["The referee blows the whistle, and the game begins.","Trọng tài thổi còi, trận đấu bắt đầu."],["In the first half, 6B scores a goal.","Hiệp một, 6B ghi một bàn."],["Minh's team doesn't give up. Their supporters shout and cheer for them.","Đội của Minh không bỏ cuộc. Cổ động viên hò hét cổ vũ các bạn."],["In the second half, Nam kicks the ball hard and scores.","Hiệp hai, Nam sút mạnh và ghi bàn."],["Then Minh catches a pass and scores again. They win 2–1!","Sau đó Minh nhận đường chuyền và ghi thêm một bàn nữa. Các bạn thắng 2–1!"],["Meanwhile, Lan wins the chess competition, and Mai gets a medal in swimming.","Trong khi đó, Lan vô địch cờ vua và Mai giành huy chương môn bơi."],["At the end of the day, the class holds up the trophy together.","Cuối ngày, cả lớp cùng nâng chiếc cúp."],["Their teacher says, “Teamwork is the real prize.”","Cô giáo nói: “Tinh thần đồng đội mới là giải thưởng thật sự.”"]]},"6.9":{"t":"Postcards from Around the World","tv":"Những tấm bưu thiếp từ khắp thế giới","s":[["Lan's uncle is a pilot, and he sends her postcards from many cities.","Chú của Lan là phi công, và chú gửi cho cô bé bưu thiếp từ nhiều thành phố."],["The first postcard comes from Paris, with a picture of the Eiffel Tower.","Tấm bưu thiếp đầu tiên đến từ Pa-ri, có hình tháp Eiffel."],["He writes that Paris is famous for its art, cafés and tasty food.","Chú viết rằng Pa-ri nổi tiếng về nghệ thuật, quán cà phê và đồ ăn ngon."],["The next one shows Big Ben in London. “It rains a lot here,” he writes.","Tấm tiếp theo có hình tháp đồng hồ Big Ben ở Luân Đôn. “Ở đây mưa nhiều lắm,” chú viết."],["From Sydney, he sends a photo of the Sydney Opera House by the sea.","Từ Xít-ni, chú gửi ảnh nhà hát Opera Sydney bên bờ biển."],["In New York, he visits the Statue of Liberty and many tall buildings.","Ở Niu Oóc, chú đến thăm tượng Nữ thần Tự do và rất nhiều tòa nhà cao tầng."],["Tokyo is an exciting city with fast trains and friendly people.","Tô-ky-ô là một thành phố sôi động với tàu siêu tốc và người dân thân thiện."],["Singapore is a very clean city, and the Merlion is its symbol.","Singapore là một thành phố rất sạch, và tượng Sư tử biển là biểu tượng của nơi đây."],["In Rome, he sees an old castle and a beautiful cathedral.","Ở Rô-ma, chú thấy một lâu đài cổ và một nhà thờ lớn tuyệt đẹp."],["Lan sticks all the postcards on her bedroom wall.","Lan dán tất cả bưu thiếp lên tường phòng ngủ."],["She dreams of visiting these cities one day.","Cô bé mơ một ngày nào đó sẽ được đến thăm những thành phố này."]]},"6.10":{"t":"Minh's House in 2050","tv":"Ngôi nhà của Minh năm 2050","s":[["Minh writes an essay about his dream house in the future.","Minh viết một bài luận về ngôi nhà mơ ước của cậu trong tương lai."],["In 2050, he will live in a smart house by the sea.","Năm 2050, cậu sẽ sống trong một ngôi nhà thông minh bên bờ biển."],["The house will have solar panels on the roof, so it will make its own electricity.","Ngôi nhà sẽ có pin mặt trời trên mái nên tự tạo ra điện."],["A robot will do the housework for him.","Một con rô-bốt sẽ làm việc nhà giúp cậu."],["It will clean the floors, sweep the yard and do the washing-up.","Nó sẽ lau sàn, quét sân và rửa bát."],["It will also feed his cat and water the plants every evening.","Nó còn cho mèo ăn và tưới cây mỗi tối."],["The washing machine will wash and dry his clothes in ten minutes.","Máy giặt sẽ giặt và sấy khô quần áo chỉ trong mười phút."],["He won't need a key, because the door will recognize his face.","Cậu sẽ không cần chìa khóa vì cửa nhận diện được khuôn mặt cậu."],["The lights and the air conditioner will switch on when he comes home.","Đèn và máy điều hòa sẽ tự bật khi cậu về đến nhà."],["But Minh will still make his own bed and tidy his room.","Nhưng Minh vẫn sẽ tự dọn giường và sắp xếp phòng gọn gàng."],["“Some chores are good for us,” he writes at the end.","“Có những việc nhà tốt cho chính mình,” cậu viết ở cuối bài."]]},"6.11":{"t":"The Green Club","tv":"Câu lạc bộ Xanh","s":[["Lan starts a Green Club at school to protect the environment.","Lan lập Câu lạc bộ Xanh ở trường để bảo vệ môi trường."],["Their first campaign is called “Reduce, Reuse, Recycle”.","Chiến dịch đầu tiên của các bạn tên là “Giảm thiểu, Tái sử dụng, Tái chế”."],["Members put a recycling bin in every classroom for paper, bottles and cans.","Các thành viên đặt thùng rác tái chế ở mỗi lớp để bỏ giấy, chai và lon."],["They ask students to bring a reusable bottle instead of buying disposable ones.","Các bạn đề nghị học sinh mang bình nước tái sử dụng thay vì mua chai dùng một lần."],["In the canteen, there are no more plastic straws.","Ở căng tin không còn ống hút nhựa nữa."],["Mai's group makes compost from food waste for the school garden.","Nhóm của Mai làm phân hữu cơ từ thức ăn thừa cho vườn trường."],["Nam reminds everyone to switch off the lights and fans to save energy.","Nam nhắc mọi người tắt đèn và quạt để tiết kiệm năng lượng."],["On Saturday, the club volunteers to clean up the park and plant trees.","Thứ Bảy, câu lạc bộ tình nguyện dọn dẹp công viên và trồng cây."],["They also bring cloth bags to the market and say no to plastic bags.","Các bạn còn mang túi vải đi chợ và nói không với túi ni-lông."],["Their teacher is proud: “You are raising awareness in our community.”","Cô giáo rất tự hào: “Các em đang nâng cao nhận thức cho cộng đồng.”"],["Small actions can make our world greener.","Những việc làm nhỏ có thể giúp thế giới xanh hơn."]]},"6.12":{"t":"Robo, the Helpful Robot","tv":"Robo, chú rô-bốt chăm chỉ","s":[["At the science fair, Minh's team shows their home robot, Robo.","Ở hội chợ khoa học, nhóm của Minh giới thiệu chú rô-bốt gia đình tên Robo."],["Robo is a small humanoid robot with two arms and big eyes.","Robo là một rô-bốt hình người nhỏ, có hai cánh tay và đôi mắt to."],["It is battery-powered, and it has many sensors on its head.","Nó chạy bằng pin và có nhiều cảm biến trên đầu."],["Robo can recognize faces and say hello to visitors.","Robo nhận ra được khuôn mặt và chào khách tham quan."],["It can make coffee, water the garden and do the dishes.","Nó biết pha cà phê, tưới vườn và rửa bát đĩa."],["Minh controls it with an app on his phone.","Minh điều khiển nó bằng một ứng dụng trên điện thoại."],["A visitor asks, “Can Robo understand feelings?”","Một vị khách hỏi: “Robo có hiểu được cảm xúc không?”"],["“Not yet,” Minh answers. “But it can lift heavy things and help old people.”","“Chưa ạ,” Minh trả lời. “Nhưng nó nâng được vật nặng và giúp đỡ người già.”"],["Lan explains that in the future, worker robots will build houses and doctor robots will help in hospitals.","Lan giải thích rằng trong tương lai, rô-bốt công nhân sẽ xây nhà, còn rô-bốt bác sĩ sẽ hỗ trợ trong bệnh viện."],["Space robots are already exploring Mars.","Rô-bốt vũ trụ hiện đã đang khám phá sao Hỏa."],["The judges love Robo, and the team wins second prize.","Ban giám khảo rất thích Robo, và nhóm giành giải nhì."]]},"7.1":{"t":"What's Your Hobby?","tv":"Sở thích của bạn là gì?","s":[["In grade 7, Ms Hoa asks every student to talk about their hobby.","Lên lớp 7, cô Hoa yêu cầu mỗi học sinh nói về sở thích của mình."],["Lan says her hobby is reading; she reads two books a month.","Lan kể sở thích của bạn ấy là đọc sách, mỗi tháng đọc hai cuốn."],["Nam is keen on video games, but he also enjoys cooking with his dad.","Nam mê trò chơi điện tử, nhưng cũng thích nấu ăn cùng bố."],["Mai is fond of drawing and painting, and she also does origami.","Mai thích vẽ tranh và tô màu, bạn ấy còn biết gấp giấy origami."],["She can make a paper crane in two minutes!","Bạn ấy gấp được một con hạc giấy chỉ trong hai phút!"],["Minh has an unusual hobby: he collects stamps from different countries.","Minh có một sở thích đặc biệt: cậu sưu tầm tem của nhiều nước."],["His collection has more than three hundred stamps.","Bộ sưu tập của cậu có hơn ba trăm con tem."],["Some students like outdoor hobbies, such as hiking, fishing and gardening.","Một số bạn thích sở thích ngoài trời như đi bộ đường dài, câu cá và làm vườn."],["Others prefer indoor ones like board games, puzzles, singing and dancing.","Số khác lại thích các thú vui trong nhà như cờ bàn, xếp hình, ca hát và nhảy."],["Ms Hoa says a good hobby helps us relax in our free time and learn new skills.","Cô Hoa nói một sở thích tốt giúp ta thư giãn lúc rảnh và học thêm kỹ năng mới."],["Then she smiles: “My hobby is photography. Let me take a photo of you all!”","Rồi cô cười: “Sở thích của cô là chụp ảnh. Để cô chụp cả lớp một tấm nhé!”"]]},"7.2":{"t":"Nam Catches the Flu","tv":"Nam bị cúm","s":[["Last week, Nam felt ill on Monday morning.","Tuần trước, sáng thứ Hai Nam thấy trong người không khỏe."],["He had a headache, a sore throat and a high fever.","Cậu bị đau đầu, đau họng và sốt cao."],["He also had a bad cough, and his whole body hurt.","Cậu còn ho nhiều và đau nhức khắp người."],["His mother took him to the doctor, who said he had the flu.","Mẹ đưa cậu đi khám, bác sĩ nói cậu bị cúm."],["“It's a virus,” the doctor explained. “You need to rest and drink a lot of water.”","“Đây là do vi-rút,” bác sĩ giải thích. “Cháu cần nghỉ ngơi và uống nhiều nước.”"],["Nam stayed in bed for three days and felt very tired and dizzy.","Nam nằm trên giường ba ngày, người rất mệt và chóng mặt."],["He also hurt his knee when he got up too fast and fell.","Cậu còn bị đau đầu gối vì đứng dậy quá nhanh và bị ngã."],["Lan brought him the homework and some oranges.","Lan mang bài tập về nhà và mấy quả cam đến cho cậu."],["“Cover your mouth and nose when you sneeze,” she said, “or everyone will get sick!”","“Che miệng và mũi khi hắt hơi nhé,” bạn ấy nói, “không thì cả lớp bị lây đấy!”"],["By Friday, Nam felt much better.","Đến thứ Sáu, Nam đã khỏe hơn nhiều."],["Now he washes his hands more often and goes to bed earlier.","Giờ cậu rửa tay thường xuyên hơn và đi ngủ sớm hơn."],["A healthy body starts with healthy habits.","Cơ thể khỏe mạnh bắt đầu từ những thói quen lành mạnh."]]},"7.3":{"t":"Helping Hands","tv":"Những bàn tay giúp đỡ","s":[["In October, Minh's class joins a community service project.","Tháng Mười, lớp của Minh tham gia một dự án phục vụ cộng đồng."],["They want to raise money for an orphan centre in their district.","Các bạn muốn gây quỹ cho một trung tâm trẻ mồ côi trong quận."],["The class organizes a fundraising fair at school.","Lớp tổ chức một hội chợ gây quỹ ở trường."],["They sell handmade cards, cakes and lemonade.","Các bạn bán thiệp tự làm, bánh ngọt và nước chanh."],["Many parents and teachers donate old books and clothes.","Nhiều phụ huynh và thầy cô quyên góp sách cũ và quần áo."],["On Sunday, the students visit the centre and play with the children.","Chủ nhật, các bạn đến thăm trung tâm và chơi với các em nhỏ."],["They also help some disabled people and homeless old people nearby.","Các bạn còn giúp đỡ một số người khuyết tật và cụ già vô gia cư gần đó."],["Lan says, “Voluntary work makes me feel useful and happy.”","Lan nói: “Làm việc tình nguyện làm mình thấy mình có ích và vui.”"],["The leader of the centre thanks them for their donation.","Người phụ trách trung tâm cảm ơn các bạn vì món quà quyên góp."],["He encourages them to keep helping others.","Ông khuyến khích các bạn tiếp tục giúp đỡ mọi người."],["Everyone can contribute something, even if it is small.","Ai cũng có thể đóng góp, dù chỉ là một điều nhỏ."]]},"7.4":{"t":"The School Concert","tv":"Buổi hòa nhạc của trường","s":[["At the end of the term, Hoa Sen School holds a big concert.","Cuối học kỳ, trường Hoa Sen tổ chức một buổi hòa nhạc lớn."],["Mai's class forms a band to perform two songs.","Lớp của Mai lập một ban nhạc để biểu diễn hai bài hát."],["Minh plays the guitar, Nam plays the drums, and Lan sings.","Minh chơi ghi-ta, Nam chơi trống, còn Lan hát."],["They choose a pop song and a folk song from the north.","Các bạn chọn một bài nhạc pop và một bài dân ca miền Bắc."],["Every afternoon, they practise the melody and the rhythm.","Chiều nào các bạn cũng tập giai điệu và nhịp điệu."],["Mai doesn't play an instrument, so she paints a big picture for the stage.","Mai không chơi nhạc cụ nên bạn ấy vẽ một bức tranh lớn để trang trí sân khấu."],["On the day of the concert, the audience is very large.","Ngày diễn ra hòa nhạc, khán giả rất đông."],["The school choir sings first, then a girl plays the piano and the violin.","Dàn hợp xướng của trường hát trước, sau đó một bạn nữ chơi piano và vi-ô-lông."],["When Lan sings, everyone is quiet, and then they clap loudly.","Khi Lan hát, mọi người im lặng lắng nghe rồi vỗ tay vang dội."],["After the show, there is an art exhibition with portraits and pottery made by students.","Sau buổi diễn có triển lãm nghệ thuật trưng bày tranh chân dung và đồ gốm do học sinh làm."],["The music teacher says, “You are all talented. Never stop using your imagination.”","Thầy dạy nhạc nói: “Các em đều có tài. Đừng bao giờ ngừng dùng trí tưởng tượng của mình.”"]]},"7.5":{"t":"Cooking Pho with Grandma","tv":"Nấu phở cùng bà","s":[["On Saturday, Lan learns how to cook pho with her grandmother.","Thứ Bảy, Lan học nấu phở với bà."],["Grandma says the most important ingredient is time.","Bà nói nguyên liệu quan trọng nhất là thời gian."],["First, they boil beef bones in a big pot for six hours.","Đầu tiên, hai bà cháu ninh xương bò trong một chiếc nồi lớn suốt sáu tiếng."],["Then they roast onions and ginger to make the soup smell delicious.","Sau đó nướng hành và gừng để nước dùng thơm ngon."],["Lan chops the spring onions while Grandma adds salt, sugar and fish sauce.","Lan thái hành lá trong khi bà nêm muối, đường và nước mắm."],["They put rice noodles in a bowl, add thin slices of beef and pour the hot soup over them.","Hai bà cháu cho bánh phở vào bát, thêm những lát thịt bò mỏng rồi chan nước dùng nóng lên."],["Lan adds a little pepper and lemon. It tastes a bit sour, salty and sweet at the same time.","Lan thêm chút hạt tiêu và chanh. Vị vừa chua, vừa mặn, vừa ngọt."],["“This is much healthier than fast food,” Grandma says.","“Món này tốt cho sức khỏe hơn đồ ăn nhanh nhiều,” bà nói."],["For dessert, they have fresh fruit and a glass of iced tea.","Tráng miệng, hai bà cháu ăn trái cây tươi và uống một cốc trà đá."],["Lan writes down the recipe in her notebook.","Lan chép lại công thức vào sổ."],["Next time, she will cook pho for her whole family.","Lần tới, cô bé sẽ tự nấu phở cho cả nhà."]]},"7.6":{"t":"A Visit to an International School","tv":"Thăm một trường quốc tế","s":[["Minh's class visits an international school in the city centre.","Lớp Minh đến thăm một trường quốc tế ở trung tâm thành phố."],["The students there study most subjects in English.","Học sinh ở đây học hầu hết các môn bằng tiếng Anh."],["In a science lesson, they work on a group project instead of listening to the teacher all the time.","Trong giờ khoa học, các bạn làm dự án nhóm thay vì chỉ ngồi nghe giáo viên giảng."],["Each group gives a presentation at the end of the lesson.","Cuối giờ, mỗi nhóm thuyết trình kết quả."],["Minh notices that they ask a lot of questions and aren't afraid to make mistakes.","Minh để ý thấy các bạn đặt rất nhiều câu hỏi và không sợ mắc lỗi."],["Their homework is often an essay or a short project, not just exercises.","Bài tập về nhà của các bạn thường là một bài luận hoặc dự án ngắn chứ không chỉ là bài tập trong sách."],["A girl explains how she learns vocabulary: she writes ten new words a day and uses each one in a sentence.","Một bạn nữ chia sẻ cách học từ vựng: mỗi ngày viết mười từ mới và đặt câu với từng từ."],["She also practises pronunciation by listening to songs.","Bạn ấy còn luyện phát âm bằng cách nghe nhạc."],["Before an exam, she revises with her friends.","Trước kỳ thi, bạn ấy ôn bài cùng bạn bè."],["Minh learns that understanding is more important than memorizing.","Minh hiểu ra rằng hiểu bài quan trọng hơn học thuộc lòng."],["On the bus home, he decides to try her way of learning.","Trên xe buýt về nhà, cậu quyết định thử cách học của bạn ấy."]]},"7.7":{"t":"Stuck in a Traffic Jam","tv":"Kẹt xe","s":[["Every morning, Lan goes to school by bicycle.","Sáng nào Lan cũng đạp xe đến trường."],["But on Monday it rains heavily, so her father drives her by car.","Nhưng thứ Hai trời mưa to nên bố chở bạn ấy đi bằng ô tô."],["It is rush hour, and the traffic is terrible.","Đó là giờ cao điểm và giao thông rất tệ."],["Thousands of motorbikes, buses, taxis and trucks fill the road.","Hàng nghìn xe máy, xe buýt, tắc-xi và xe tải chen kín đường."],["A motorbike driver goes through a red light, and there is almost an accident.","Một người lái xe máy vượt đèn đỏ và suýt gây tai nạn."],["Lan's father says, “Always obey the traffic rules and wear your seat belt.”","Bố Lan nói: “Luôn phải chấp hành luật giao thông và thắt dây an toàn con nhé.”"],["Lan arrives at school twenty minutes late.","Lan đến trường muộn hai mươi phút."],["In class, they discuss how to reduce traffic jams.","Trong lớp, các bạn thảo luận cách giảm ùn tắc giao thông."],["Minh says more people should take the metro or the bus.","Minh nói nên có nhiều người đi tàu điện hoặc xe buýt hơn."],["Nam thinks cycling is the best way for a short journey.","Nam cho rằng đạp xe là cách tốt nhất cho quãng đường ngắn."],["Their teacher agrees: “Public transport is cheaper, faster and better for our city.”","Cô giáo đồng ý: “Phương tiện công cộng rẻ hơn, nhanh hơn và tốt hơn cho thành phố của chúng ta.”"]]},"7.8":{"t":"Movie Night","tv":"Tối xem phim","s":[["On Friday evening, the four friends go to the cinema together.","Tối thứ Sáu, bốn bạn rủ nhau đi xem phim."],["Nam wants to see an action film, but Mai hates violence.","Nam muốn xem phim hành động, nhưng Mai rất ghét cảnh bạo lực."],["Lan suggests a comedy, and Minh prefers science fiction.","Lan gợi ý phim hài, còn Minh thích phim khoa học viễn tưởng."],["Finally, they choose an animated film about a brave little robot.","Cuối cùng, các bạn chọn một bộ phim hoạt hình về một chú rô-bốt nhỏ dũng cảm."],["They watched the trailer online, and the reviews were great.","Các bạn đã xem đoạn giới thiệu trên mạng và lời đánh giá rất tốt."],["The plot is exciting, and the last scene makes Mai cry.","Cốt truyện hấp dẫn, và cảnh cuối khiến Mai rơi nước mắt."],["The film has English subtitles, so they practise reading too.","Phim có phụ đề tiếng Anh nên các bạn được luyện đọc luôn."],["After the movie, they talk about their favourite character.","Xem xong, các bạn bàn tán về nhân vật mình thích nhất."],["Nam says the star of the film is the funny cat, not the robot!","Nam bảo ngôi sao của bộ phim là con mèo vui tính chứ không phải chú rô-bốt!"],["At home, Minh finds a documentary about real robots on a science channel.","Về nhà, Minh tìm được một bộ phim tài liệu về rô-bốt thật trên một kênh khoa học."],["He watches the first episode before bed.","Cậu xem tập đầu tiên trước khi đi ngủ."]]},"7.9":{"t":"Festivals Around the World","tv":"Lễ hội khắp thế giới","s":[["For a class project, each group presents a festival from another country.","Trong một dự án của lớp, mỗi nhóm giới thiệu một lễ hội của một nước khác."],["Lan's group talks about Songkran in Thailand, a festival where people splash water to welcome the new year.","Nhóm Lan nói về Songkran ở Thái Lan, lễ hội người ta té nước để đón năm mới."],["Nam's group chooses La Tomatina in Spain, where thousands of people throw tomatoes at each other.","Nhóm Nam chọn La Tomatina ở Tây Ban Nha, nơi hàng nghìn người ném cà chua vào nhau."],["Mai's group presents Diwali, the Indian festival of lights.","Nhóm Mai giới thiệu Diwali, lễ hội ánh sáng của Ấn Độ."],["It is a religious festival, and families light lamps and share sweets.","Đó là một lễ hội tôn giáo, các gia đình thắp đèn và chia nhau bánh kẹo."],["Minh's group shows photos of the Rio Carnival, with colourful floats and dancers.","Nhóm Minh trình chiếu ảnh lễ hội hóa trang Rio với những xe hoa rực rỡ và vũ công."],["In America, families gather for Thanksgiving and eat turkey together.","Ở Mỹ, các gia đình quây quần dịp Lễ Tạ ơn và cùng ăn gà tây."],["Their teacher reminds them about Vietnamese holidays too, like the Hung Kings' Festival and National Day.","Cô giáo cũng nhắc các bạn về những ngày lễ của Việt Nam như Giỗ Tổ Hùng Vương và Quốc khánh."],["On Teachers' Day, the class invites Ms Hoa to a small party.","Vào Ngày Nhà giáo, cả lớp mời cô Hoa đến dự một bữa tiệc nhỏ."],["They give her flowers and say, “Congratulations and thank you!”","Các bạn tặng cô hoa và nói: “Chúc mừng cô và cảm ơn cô ạ!”"],["Every festival is a special occasion to bring people together.","Mỗi lễ hội là một dịp đặc biệt để gắn kết mọi người."]]},"7.10":{"t":"Where Does Our Electricity Come From?","tv":"Điện của chúng ta từ đâu mà có?","s":[["In a physics lesson, the class learns about energy sources.","Trong giờ vật lý, cả lớp học về các nguồn năng lượng."],["Most of our electricity comes from power stations that burn coal or gas.","Phần lớn điện của chúng ta đến từ các nhà máy điện đốt than hoặc khí đốt."],["These fossil fuels are non-renewable, and they are limited.","Những nhiên liệu hóa thạch này không tái tạo được và có hạn."],["Burning them produces carbon dioxide, which causes global warming and climate change.","Đốt chúng sinh ra khí CO2, gây nóng lên toàn cầu và biến đổi khí hậu."],["As the ice melts, the sea level rises.","Khi băng tan, mực nước biển dâng lên."],["Viet Nam also uses hydropower from big rivers.","Việt Nam còn dùng thủy điện từ các con sông lớn."],["Solar energy and wind power are renewable and plentiful.","Năng lượng mặt trời và năng lượng gió có thể tái tạo và rất dồi dào."],["Some farmers make biogas from animal waste to cook their meals.","Một số nông dân làm khí sinh học từ chất thải chăn nuôi để nấu ăn."],["Nuclear energy is powerful, but some people think it is dangerous.","Năng lượng hạt nhân rất mạnh, nhưng một số người cho rằng nó nguy hiểm."],["At home, Minh replaces old light bulbs with energy-saving ones.","Ở nhà, Minh thay bóng đèn cũ bằng bóng đèn tiết kiệm năng lượng."],["He wants to make his family's carbon footprint smaller.","Cậu muốn giảm lượng khí thải các-bon của gia đình mình."]]},"7.11":{"t":"A Holiday in 2060","tv":"Kỳ nghỉ năm 2060","s":[["Nam writes a story about travelling in the future.","Nam viết một câu chuyện về việc đi lại trong tương lai."],["In 2060, his family goes on holiday to Japan.","Năm 2060, gia đình cậu đi nghỉ ở Nhật Bản."],["They don't drive to the airport. A driverless car picks them up.","Cả nhà không lái xe ra sân bay. Một chiếc ô tô tự lái đến đón họ."],["At the airport, there are no long queues at security or customs.","Ở sân bay không còn những hàng dài ở cửa an ninh hay hải quan."],["A camera checks their faces, so they don't need a boarding pass.","Camera kiểm tra khuôn mặt nên họ không cần thẻ lên máy bay."],["The plane is solar-powered and flies on autopilot.","Máy bay chạy bằng năng lượng mặt trời và bay ở chế độ tự lái."],["The flight takes only two hours, so nobody has jet lag.","Chuyến bay chỉ mất hai tiếng nên không ai bị lệch múi giờ."],["In Tokyo, they travel by hyperloop at 1,000 kilometres per hour.","Ở Tô-ky-ô, cả nhà đi tàu siêu tốc hyperloop với tốc độ 1.000 ki-lô-mét một giờ."],["The city is traffic-free and pollution-free.","Thành phố không tắc đường và không ô nhiễm."],["At the hotel, the receptionist is a robot, and the key card is on their phones.","Ở khách sạn, nhân viên lễ tân là rô-bốt và thẻ khóa nằm ngay trong điện thoại."],["At the end, Nam writes: “I still want a bamboo-copter like Doraemon!”","Cuối bài, Nam viết: “Mình vẫn muốn có chong chóng tre như Đô-rê-mon!”"]]},"7.12":{"t":"English Around the World","tv":"Tiếng Anh khắp thế giới","s":[["Ms Hoa shows the class a world map.","Cô Hoa cho cả lớp xem bản đồ thế giới."],["English is the first language in England, America, Australia and Canada.","Tiếng Anh là ngôn ngữ thứ nhất ở Anh, Mỹ, Úc và Ca-na-đa."],["In Singapore and India, English is one of the official languages.","Ở Singapore và Ấn Độ, tiếng Anh là một trong các ngôn ngữ chính thức."],["People in many other countries, like Japan, Korea, China and France, learn it as a foreign language.","Người dân ở nhiều nước khác như Nhật Bản, Hàn Quốc, Trung Quốc và Pháp học nó như một ngoại ngữ."],["Lan wants to study in Australia because she loves kangaroos.","Lan muốn đi du học Úc vì bạn ấy thích chuột túi."],["Minh dreams of visiting London to see the British Museum.","Minh mơ được đến Luân Đôn xem Bảo tàng Anh."],["Nam says American films helped him learn many English words.","Nam kể phim Mỹ đã giúp cậu học được nhiều từ tiếng Anh."],["Mai asks, “Do all English speakers sound the same?”","Mai hỏi: “Người nói tiếng Anh có giọng giống hệt nhau không cô?”"],["“No,” Ms Hoa answers. “British, American and Australian English sound different, but they can all understand each other.”","“Không,” cô Hoa đáp. “Tiếng Anh của người Anh, người Mỹ và người Úc nghe khác nhau, nhưng họ đều hiểu nhau.”"],["She explains that English is an international language that connects people from Asia, Europe and Africa.","Cô giải thích rằng tiếng Anh là ngôn ngữ quốc tế, kết nối mọi người ở châu Á, châu Âu và châu Phi."],["Learning English is like opening a door to the whole world.","Học tiếng Anh giống như mở ra cánh cửa đến với cả thế giới."]]},"8.1":{"t":"A Weekend at the Theme Park","tv":"Cuối tuần ở công viên giải trí","s":[["After a stressful exam week, the friends need some fun.","Sau một tuần thi căng thẳng, nhóm bạn cần chút niềm vui."],["Lan recommends a new theme park outside the city.","Lan giới thiệu một công viên giải trí mới ở ngoại thành."],["She read a review online that said it was amazing.","Bạn ấy đọc được một bài đánh giá trên mạng nói rằng nơi đó tuyệt vời lắm."],["The roller coaster is the most popular ride, and the queue is very long.","Tàu lượn siêu tốc là trò được ưa chuộng nhất và hàng người chờ rất dài."],["Nam screams the whole time, but he says it is awesome.","Nam hét suốt cả lượt chơi, nhưng cậu bảo trò đó cực đỉnh."],["In the afternoon, they watch a magic show.","Buổi chiều, các bạn xem một buổi biểu diễn ảo thuật."],["The magician makes a rabbit disappear, and a funny clown makes everyone laugh.","Ảo thuật gia làm biến mất một chú thỏ, còn anh hề vui tính khiến ai cũng bật cười."],["Mai thinks the circus is more entertaining than the rides.","Mai thấy xiếc thú vị hơn các trò chơi cảm giác mạnh."],["Later, it starts to rain, and the weather becomes terrible.","Sau đó trời đổ mưa và thời tiết trở nên rất tệ."],["So they go home and have a small karaoke party at Minh's house.","Thế là các bạn về nhà và tổ chức một buổi hát karaoke nhỏ ở nhà Minh."],["Lan says, “Leisure time with friends is the most relaxing thing in the world.”","Lan nói: “Thời gian rảnh bên bạn bè là điều thư giãn nhất trên đời.”"]]},"8.2":{"t":"Summer on Grandpa's Farm","tv":"Mùa hè ở trang trại của ông","s":[["Every summer, Minh spends two weeks on his grandpa's farm in the countryside.","Mỗi mùa hè, Minh dành hai tuần ở trang trại của ông dưới quê."],["Life there is slow and peaceful.","Cuộc sống ở đó chậm rãi và yên bình."],["He wakes up when the rooster crows at five o'clock.","Cậu thức dậy khi gà trống gáy lúc năm giờ sáng."],["He feeds the chickens, the ducks and the pigs, and he collects eggs from the hens.","Cậu cho gà, vịt, lợn ăn và nhặt trứng gà mái đẻ."],["His grandpa uses a buffalo to work in the rice field.","Ông dùng trâu để cày ruộng lúa."],["In the garden, they grow vegetables like cabbage, carrots, tomatoes and cucumbers.","Trong vườn, hai ông cháu trồng các loại rau như bắp cải, cà rốt, cà chua và dưa chuột."],["There are also many fruit trees: mango, banana, coconut and papaya.","Còn có nhiều cây ăn quả: xoài, chuối, dừa và đu đủ."],["In the afternoon, Minh climbs a tree to pick fresh mangoes.","Buổi chiều, Minh trèo cây hái xoài tươi."],["His grandma cooks fish from the pond with garlic, onion and fresh herbs.","Bà nấu món cá bắt từ ao với tỏi, hành và rau thơm tươi."],["In the evening, they sit under the bamboo trees and look at the stars.","Buổi tối, mọi người ngồi dưới lũy tre ngắm sao."],["There is no traffic and no smoke, only fresh air and the sound of the wind.","Không có xe cộ, không khói bụi, chỉ có không khí trong lành và tiếng gió."],["Minh loves the countryside, but he misses the internet a little!","Minh yêu vùng quê, nhưng cậu hơi nhớ mạng internet!"]]},"8.3":{"t":"Growing Up Is Not Easy","tv":"Lớn lên không dễ dàng","s":[["Lan is fourteen now, and her feelings change quickly.","Lan nay đã mười bốn tuổi, và cảm xúc của bạn ấy thay đổi rất nhanh."],["Some days she feels happy and confident; other days she feels stressed and lonely.","Có hôm bạn ấy thấy vui vẻ và tự tin, có hôm lại thấy căng thẳng và cô đơn."],["Last month, she had a quarrel with Mai about a small thing.","Tháng trước, bạn ấy cãi nhau với Mai vì một chuyện nhỏ."],["They didn't talk for a week, and both of them were upset.","Hai bạn không nói chuyện với nhau suốt một tuần, cả hai đều buồn bực."],["At the same time, some older students bullied Nam online.","Cùng lúc đó, mấy anh chị khóa trên bắt nạt Nam trên mạng."],["Nam was embarrassed and scared, so he didn't tell anyone.","Nam xấu hổ và sợ hãi nên không kể với ai."],["Lan noticed and encouraged him to talk to their teacher.","Lan để ý thấy và khuyên cậu nói với cô giáo."],["The teacher helped, and the school made a new rule about online behaviour.","Cô giáo đã giúp đỡ và nhà trường ban hành quy định mới về hành vi trên mạng."],["Lan realized that friendship needs trust and support.","Lan nhận ra tình bạn cần sự tin tưởng và nâng đỡ lẫn nhau."],["She said sorry to Mai, and Mai forgave her immediately.","Bạn ấy xin lỗi Mai và Mai tha thứ ngay lập tức."],["Being a teenager means dealing with peer pressure, conflict and strong emotions.","Làm thiếu niên nghĩa là phải đối mặt với áp lực bạn bè, mâu thuẫn và những cảm xúc mạnh."],["But with good friends, it is much easier.","Nhưng có bạn tốt bên cạnh thì mọi chuyện dễ dàng hơn nhiều."]]},"8.4":{"t":"A Trip to the Central Highlands","tv":"Chuyến đi Tây Nguyên","s":[["Viet Nam has 54 ethnic groups, and each has its own culture.","Việt Nam có 54 dân tộc, mỗi dân tộc có nền văn hóa riêng."],["The Kinh are the largest group, but there are many others, like the Tay, the Hmong, the Ede and the Khmer.","Người Kinh là dân tộc đông nhất, ngoài ra còn nhiều dân tộc khác như Tày, H'Mông, Ê-đê và Khơ-me."],["In spring, Minh's class visits an Ede village in the Central Highlands.","Mùa xuân, lớp Minh đến thăm một buôn làng người Ê-đê ở Tây Nguyên."],["The Ede live in long stilt houses made of wood and bamboo.","Người Ê-đê sống trong những ngôi nhà sàn dài làm bằng gỗ và tre."],["In the middle of the village, there is a tall communal house.","Giữa làng có một ngôi nhà rông cao vút."],["The villagers grow coffee and cultivate rice, and they also raise livestock.","Dân làng trồng cà phê, canh tác lúa và còn chăn nuôi gia súc."],["The women weave beautiful brocade with bright colours.","Phụ nữ dệt những tấm thổ cẩm tuyệt đẹp với màu sắc rực rỡ."],["In the evening, the students join a festival at the festival ground.","Buổi tối, các bạn tham gia lễ hội ở sân lễ hội."],["Men play gongs, a traditional musical instrument, and everyone dances around the fire.","Đàn ông đánh cồng chiêng, một loại nhạc cụ truyền thống, và mọi người nhảy múa quanh đống lửa."],["Later, they visit a museum that displays old tools and earthen pots.","Sau đó, các bạn tham quan một bảo tàng trưng bày công cụ cổ và nồi đất."],["Mai says, “Each group has unique customs, and that makes our country rich.”","Mai nói: “Mỗi dân tộc có những phong tục độc đáo, và điều đó làm đất nước mình thêm phong phú.”"]]},"8.5":{"t":"Customs in Lan's Family","tv":"Phong tục trong gia đình Lan","s":[["In Lan's family, there are many old customs and traditions.","Gia đình Lan giữ nhiều phong tục và truyền thống từ xưa."],["At meals, the young people must invite the elders to eat first.","Trong bữa ăn, người nhỏ tuổi phải mời người lớn ăn trước."],["It shows respect, which is very important in Vietnamese culture.","Việc đó thể hiện sự kính trọng, điều rất quan trọng trong văn hóa Việt Nam."],["On the first day of each lunar month, her grandma burns incense and prays at the family altar.","Ngày mùng một mỗi tháng âm lịch, bà của Lan thắp hương và khấn trước bàn thờ gia tiên."],["It is a belief that ancestors protect the family.","Theo tín ngưỡng, tổ tiên luôn che chở cho gia đình."],["Lan also loves the legend of the Mid-Autumn Festival about Cuoi and the banyan tree on the moon.","Lan còn rất thích truyền thuyết Trung thu về chú Cuội và cây đa trên cung trăng."],["Her grandpa tells her folk stories and teaches her traditional songs.","Ông kể cho cô bé nghe truyện dân gian và dạy hát những bài hát truyền thống."],["In class, Lan's group presents a project about national symbols, like the flag and the lotus.","Trên lớp, nhóm của Lan thuyết trình dự án về các biểu tượng quốc gia như lá cờ và hoa sen."],["Their teacher says diversity makes a nation strong, but we must keep our cultural identity.","Cô giáo nói sự đa dạng làm nên sức mạnh của một dân tộc, nhưng chúng ta phải giữ gìn bản sắc văn hóa."],["Lan agrees: “Some customs may change, but our language and heritage should stay.”","Lan đồng ý: “Một số phong tục có thể thay đổi, nhưng tiếng nói và di sản của mình thì phải giữ lại.”"]]},"8.6":{"t":"Mai's New Routine","tv":"Thói quen mới của Mai","s":[["Mai used to wake up late and run to school without breakfast.","Mai từng thức dậy muộn và chạy vội đến trường mà không ăn sáng."],["This year, she decides to change her lifestyle.","Năm nay, bạn ấy quyết định thay đổi lối sống."],["Her alarm clock rings at 5:45, and she gets up immediately.","Đồng hồ báo thức reo lúc 5 giờ 45 và bạn ấy dậy ngay lập tức."],["She takes a shower, brushes her teeth and has breakfast with her family.","Bạn ấy tắm, đánh răng và ăn sáng cùng gia đình."],["She prepares her clothes the night before, so she doesn't waste time.","Bạn ấy chuẩn bị quần áo từ tối hôm trước để không mất thời gian."],["Mai is interested in fashion, and she wants to be a designer.","Mai quan tâm đến thời trang và muốn trở thành nhà thiết kế."],["She doesn't buy expensive brands; she prefers comfortable cotton clothes.","Bạn ấy không mua hàng hiệu đắt tiền mà thích quần áo vải bông thoải mái."],["She can sew, and she makes her own outfits from old jeans and shirts.","Bạn ấy biết may và tự làm trang phục từ quần bò và áo sơ mi cũ."],["Her style is casual but stylish: plain T-shirts, striped skirts and a denim jacket.","Phong cách của bạn ấy giản dị mà sành điệu: áo phông trơn, chân váy kẻ sọc và áo khoác bò."],["After school, she does her homework, takes a short nap and helps fold the laundry.","Sau giờ học, bạn ấy làm bài tập, ngủ một giấc ngắn và phụ gấp quần áo."],["She goes to bed at ten, so she feels fresh every morning.","Bạn ấy đi ngủ lúc mười giờ nên sáng nào cũng thấy sảng khoái."]]},"8.7":{"t":"Saving the River","tv":"Cứu lấy dòng sông","s":[["Near Minh's school, there is a river that used to be clean.","Gần trường Minh có một con sông trước đây rất sạch."],["Now it is badly polluted.","Bây giờ nó bị ô nhiễm nặng."],["Factories pour chemicals and sewage into the water, and people throw rubbish into it.","Các nhà máy xả hóa chất và nước thải xuống sông, còn người dân thì vứt rác xuống."],["The water is dirty and smells terrible, and many fish have died.","Nước bẩn, bốc mùi khó chịu và nhiều con cá đã chết."],["In science class, the students learn that water pollution damages the whole ecosystem.","Trong giờ khoa học, các bạn học được rằng ô nhiễm nước gây hại cho cả hệ sinh thái."],["Toxic water also harms the health of people who live nearby.","Nước nhiễm độc còn gây hại cho sức khỏe người dân sống gần đó."],["The class decides to find a solution to this problem.","Cả lớp quyết định tìm giải pháp cho vấn đề này."],["They write a letter to the local government and ask them to check the factories.","Các bạn viết thư gửi chính quyền địa phương đề nghị kiểm tra các nhà máy."],["On Sunday, they clean up the riverbank and put up signs: “Don't litter!”","Chủ nhật, các bạn dọn dẹp bờ sông và dựng biển báo: “Không xả rác!”"],["A local newspaper writes an article about them.","Một tờ báo địa phương viết bài về các bạn."],["If we don't protect our natural resources, there will be a shortage of clean water in the future.","Nếu không bảo vệ tài nguyên thiên nhiên, tương lai sẽ thiếu nước sạch."]]},"8.8":{"t":"Shopping for a Birthday Gift","tv":"Đi mua quà sinh nhật","s":[["Next week is Lan's birthday, so Minh goes shopping for a gift.","Tuần sau là sinh nhật Lan nên Minh đi mua quà."],["He has 300,000 dong in his pocket money.","Cậu có 300.000 đồng tiền tiêu vặt."],["First, he goes to a department store, but everything is too expensive.","Đầu tiên, cậu vào một cửa hàng bách hóa, nhưng món nào cũng quá đắt."],["A scarf costs 450,000 dong, and a bracelet costs even more.","Một chiếc khăn quàng giá 450.000 đồng, còn một chiếc vòng tay thì đắt hơn nữa."],["Then he visits the night market, where things are much cheaper.","Sau đó cậu ghé chợ đêm, nơi đồ rẻ hơn nhiều."],["He finds a lovely hairband and a small backpack with a 20% discount.","Cậu tìm được một chiếc băng đô xinh xắn và một chiếc ba lô nhỏ đang giảm giá 20%."],["He compares the prices and tries to bargain with the seller.","Cậu so sánh giá và thử mặc cả với người bán."],["Finally, he buys the backpack for 250,000 dong and asks the seller to wrap it.","Cuối cùng, cậu mua chiếc ba lô với giá 250.000 đồng và nhờ người bán gói lại."],["He keeps the receipt in case Lan wants to return it.","Cậu giữ lại hóa đơn phòng khi Lan muốn đổi trả."],["With the change, he buys a birthday card at a convenience store.","Với số tiền thừa, cậu mua một tấm thiệp sinh nhật ở cửa hàng tiện lợi."],["At the party, Lan opens the gift and says, “It's perfect! Did you buy it online?”","Ở bữa tiệc, Lan mở quà và nói: “Hoàn hảo luôn! Cậu mua trên mạng à?”"],["Minh smiles: “No, I chose it myself.”","Minh mỉm cười: “Không, tớ tự đi chọn đấy.”"]]},"8.9":{"t":"The Night of the Storm","tv":"Đêm bão","s":[["In October, a strong typhoon hits the central coast of Viet Nam.","Tháng Mười, một cơn bão mạnh đổ bộ vào bờ biển miền Trung Việt Nam."],["The weather forecast warns people to stay at home.","Bản tin dự báo thời tiết cảnh báo người dân ở yên trong nhà."],["Mai's aunt lives in Quang Nam, and Mai is very worried about her.","Dì của Mai sống ở Quảng Nam và Mai rất lo cho dì."],["That night, the wind is very strong, and the rain doesn't stop.","Đêm đó gió rất mạnh và mưa không ngớt."],["There is thunder and lightning, and the electricity goes off.","Có sấm chớp, và điện bị cắt."],["The next morning, the river floods many villages.","Sáng hôm sau, nước sông dâng lên làm ngập nhiều làng."],["In the mountains, heavy rain causes a landslide.","Trên vùng núi, mưa lớn gây ra sạt lở đất."],["Luckily, Mai's aunt is safe, but her house is damaged.","May mắn là dì của Mai an toàn, nhưng nhà bị hư hại."],["Mai's class collects money, clothes and food for the people in the flooded area.","Lớp của Mai quyên góp tiền, quần áo và thực phẩm cho người dân vùng lũ."],["Their teacher explains that climate change makes natural disasters, like storms and droughts, more serious.","Cô giáo giải thích rằng biến đổi khí hậu làm cho thiên tai như bão và hạn hán ngày càng nghiêm trọng."],["After the storm, the sky is blue again, and a rainbow appears.","Sau bão, bầu trời lại trong xanh và cầu vồng xuất hiện."]]},"8.10":{"t":"Talking to the Future","tv":"Trò chuyện với tương lai","s":[["Nam's grandfather used to write letters to his pen pal, and it took weeks to get a reply.","Ông của Nam từng viết thư cho bạn qua thư, và phải mất vài tuần mới nhận được hồi âm."],["Today, Nam sends a message or makes a video call in seconds.","Ngày nay, Nam gửi tin nhắn hay gọi video chỉ trong vài giây."],["He uses social media to chat with his friends and share photos.","Cậu dùng mạng xã hội để trò chuyện với bạn bè và chia sẻ ảnh."],["But last week, someone stole his password and logged in to his account.","Nhưng tuần trước, có kẻ đánh cắp mật khẩu và đăng nhập vào tài khoản của cậu."],["They posted strange comments and a fake rumour about his friend.","Kẻ đó đăng những bình luận lạ và một tin đồn bịa đặt về bạn của cậu."],["Nam learned to use a strong password and never click on strange links.","Nam đã học được cách dùng mật khẩu mạnh và không bao giờ bấm vào đường dẫn lạ."],["In class, they discuss communication in the future.","Trong lớp, các bạn thảo luận về giao tiếp trong tương lai."],["Lan thinks people will use holograms instead of video calls.","Lan nghĩ mọi người sẽ dùng hình ảnh ba chiều thay cho gọi video."],["Minh thinks we may communicate by thought, without typing or talking.","Minh cho rằng có thể chúng ta sẽ giao tiếp bằng ý nghĩ, không cần gõ hay nói."],["Mai disagrees: “A smile, a hug and eye contact will always be important.”","Mai không đồng ý: “Nụ cười, cái ôm và ánh mắt sẽ luôn quan trọng.”"],["The teacher says body language is a part of communication that no app can replace.","Cô giáo nói ngôn ngữ cơ thể là một phần của giao tiếp mà không ứng dụng nào thay thế được."]]},"8.11":{"t":"The Young Inventors","tv":"Những nhà phát minh nhỏ tuổi","s":[["Minh's dream is to become a scientist.","Ước mơ của Minh là trở thành nhà khoa học."],["He is curious about everything and always asks, “Why?”","Cậu tò mò về mọi thứ và luôn hỏi “Tại sao?”."],["For the school science fair, his team does an experiment about clean water.","Cho hội chợ khoa học của trường, nhóm của cậu làm một thí nghiệm về nước sạch."],["They observe dirty water under a microscope and see many bacteria.","Các bạn quan sát nước bẩn dưới kính hiển vi và thấy rất nhiều vi khuẩn."],["Then they build a simple filter with sand, rocks and charcoal.","Sau đó các bạn làm một bộ lọc đơn giản bằng cát, sỏi và than củi."],["They predict that the water will become clear, and the result proves it.","Các bạn dự đoán nước sẽ trong hơn, và kết quả đã chứng minh điều đó."],["Lan writes a program that collects and analyses the data on a laptop.","Lan viết một chương trình thu thập và phân tích dữ liệu trên máy tính xách tay."],["Their teacher says they followed the scientific method very well.","Cô giáo nói các bạn đã làm đúng phương pháp khoa học."],["At the fair, they learn about artificial intelligence and robotics from other teams.","Ở hội chợ, các bạn học hỏi về trí tuệ nhân tạo và rô-bốt từ các đội khác."],["A researcher from a university gives them a prize for their invention.","Một nhà nghiên cứu ở trường đại học trao giải cho phát minh của các bạn."],["Minh says, “Maybe one day, I will win the Nobel Prize!”","Minh nói: “Biết đâu một ngày nào đó mình sẽ đoạt giải Nô-ben!”"]]},"8.12":{"t":"Is There Life on Mars?","tv":"Có sự sống trên sao Hỏa không?","s":[["Lan loves astronomy, and she has a small telescope.","Lan mê thiên văn học và có một chiếc kính thiên văn nhỏ."],["On clear nights, she looks at the moon and its craters.","Những đêm trời quang, bạn ấy ngắm mặt trăng và các miệng hố trên đó."],["She can also see Jupiter and Saturn, the biggest planets in our solar system.","Bạn ấy còn nhìn thấy sao Mộc và sao Thổ, hai hành tinh lớn nhất trong hệ mặt trời."],["Her favourite planet is Mars, the red planet.","Hành tinh bạn ấy thích nhất là sao Hỏa, hành tinh đỏ."],["Scientists have launched many rockets and robots to explore it.","Các nhà khoa học đã phóng nhiều tên lửa và rô-bốt để thám hiểm nó."],["Mars has ice, so there may be simple life, like bacteria, under its surface.","Sao Hỏa có băng nên có thể tồn tại sự sống đơn giản như vi khuẩn dưới bề mặt."],["But it is very cold, and there isn't enough oxygen for humans.","Nhưng ở đó rất lạnh và không đủ ô-xy cho con người."],["Astronauts on the space station live in zero gravity, so they float.","Các phi hành gia trên trạm vũ trụ sống trong môi trường không trọng lực nên họ lơ lửng."],["Lan wonders if aliens exist somewhere in the universe.","Lan tự hỏi liệu người ngoài hành tinh có tồn tại ở đâu đó trong vũ trụ."],["There are billions of galaxies, and some stars are many light years away.","Có hàng tỷ thiên hà, và có những ngôi sao cách xa nhiều năm ánh sáng."],["“The universe is so big,” she says. “We can't be alone.”","“Vũ trụ rộng lớn thế,” bạn ấy nói. “Chúng ta không thể chỉ có một mình được.”"]]},"9.1":{"t":"The Pottery Village","tv":"Làng gốm","s":[["For a project about their local community, Minh and Lan visit Bat Trang, a famous craft village near Ha Noi.","Để làm dự án về cộng đồng địa phương, Minh và Lan đến thăm Bát Tràng, một làng nghề nổi tiếng gần Hà Nội."],["People there have made pottery for more than 500 years.","Người dân ở đây làm gốm đã hơn 500 năm."],["The skill is passed down from generation to generation.","Tay nghề được truyền lại từ đời này sang đời khác."],["They meet an elderly artisan, Mr Hai, who has worked with clay since he was a kid.","Hai bạn gặp một nghệ nhân cao tuổi, ông Hải, người làm gốm từ khi còn là một cậu bé."],["He shows them how to pour clay into a mould and how to carve patterns on a vase.","Ông chỉ cho các bạn cách đổ đất sét vào khuôn và cách chạm khắc hoa văn lên bình."],["Many tourists look around the village and buy handicraft products as souvenirs.","Nhiều du khách đi tham quan làng và mua sản phẩm thủ công làm quà lưu niệm."],["However, Mr Hai is worried, because many young people leave the village to work in factories.","Tuy nhiên, ông Hải rất lo vì nhiều người trẻ rời làng đi làm ở các nhà máy."],["Some workshops have already closed down.","Một số xưởng đã phải đóng cửa."],["“We must preserve this craft,” he says. “We take pride in it.”","“Chúng ta phải gìn giữ nghề này,” ông nói. “Chúng ta tự hào về nó.”"],["Lan suggests setting up a website to sell their products online.","Lan đề xuất lập một trang web để bán sản phẩm trên mạng."],["Mr Hai laughs: “Young people have good ideas. Come back and help us!”","Ông Hải cười: “Người trẻ có nhiều ý tưởng hay. Các cháu quay lại giúp làng nhé!”"]]},"9.2":{"t":"City Life: Love It or Hate It?","tv":"Cuộc sống thành phố: yêu hay ghét?","s":[["In English class, the students debate: “Is city life better than country life?”","Trong giờ tiếng Anh, học sinh tranh luận: “Cuộc sống thành phố có tốt hơn nông thôn không?”"],["Nam loves the city. He says urban life is convenient and exciting.","Nam yêu thành phố. Cậu nói cuộc sống đô thị tiện lợi và sôi động."],["There are modern facilities, shopping malls, hospitals and good schools.","Ở đó có cơ sở vật chất hiện đại, trung tâm mua sắm, bệnh viện và trường học tốt."],["The nightlife is fun, and you can find delicious street food on every corner.","Cuộc sống về đêm vui nhộn, và góc phố nào cũng có đồ ăn đường phố ngon."],["Mai disagrees. She thinks the city is too crowded and noisy.","Mai không đồng ý. Bạn ấy cho rằng thành phố quá đông đúc và ồn ào."],["The population is growing fast, and traffic jams happen every day.","Dân số tăng nhanh và ngày nào cũng tắc đường."],["New skyscrapers and apartment blocks replace old houses and green spaces.","Những tòa nhà chọc trời và khu chung cư mới thay thế nhà cũ và mảng xanh."],["Lan sees both sides: the city is developing quickly, but historic landmarks should be kept.","Lan nhìn nhận cả hai mặt: thành phố đang phát triển nhanh, nhưng các địa danh lịch sử cần được giữ lại."],["She suggests more parks and public transport for residents.","Bạn ấy đề xuất thêm công viên và phương tiện công cộng cho cư dân."],["Minh says many people now move to the suburbs, where life is quieter but still close to downtown.","Minh nói nhiều người giờ chuyển ra ngoại ô, nơi cuộc sống yên tĩnh hơn mà vẫn gần trung tâm."],["At the end, the teacher smiles: “A good city is a city for its citizens.”","Cuối buổi, cô giáo mỉm cười: “Một thành phố tốt là thành phố vì người dân.”"]]},"9.3":{"t":"Healthy Habits for Teens","tv":"Thói quen lành mạnh cho tuổi teen","s":[["In grade 9, Nam often stays up late to study for the entrance exam.","Lên lớp 9, Nam thường thức khuya ôn thi vào lớp 10."],["He sleeps only five hours a night and drinks a lot of energy drinks.","Cậu chỉ ngủ năm tiếng mỗi đêm và uống rất nhiều nước tăng lực."],["One morning, he feels dizzy in class, and the school nurse takes him to the clinic.","Một buổi sáng, cậu thấy chóng mặt trong lớp và cô y tá trường đưa cậu đến phòng khám."],["The doctor gives him a check-up and says his body is very tired.","Bác sĩ khám sức khỏe cho cậu và nói cơ thể cậu đang rất mệt mỏi."],["“You don't need med
