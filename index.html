<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ từ vựng THCS – Mindmap theo SGK Global Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#F6F8F2;--grid:#DCE6EC;--ink:#1D2A3A;--muted:#5D6A78;--accent:#2B57B5;--surface:#FFFFFF;--line:#D3DCE3;
  --ok:#1E8A4C;--bad:#C2392B;--s:62%;--l:44%;--tint:91%;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15201B;--grid:#1F2C26;--ink:#E8EDE3;--muted:#9BA89F;--accent:#9DBBFF;--surface:#1C2923;--line:#2C3B34;
  --ok:#5BD08C;--bad:#FF8A7A;--l:67%;--tint:21%;}}
:root[data-theme="dark"]{
  --paper:#15201B;--grid:#1F2C26;--ink:#E8EDE3;--muted:#9BA89F;--accent:#9DBBFF;--surface:#1C2923;--line:#2C3B34;
  --ok:#5BD08C;--bad:#FF8A7A;--l:67%;--tint:21%;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:var(--ui);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px;max-width:900px;width:100%;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--disp);font-weight:800;font-size:1.6rem;line-height:1;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--ui);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:6px;letter-spacing:0}
.known{font-size:.82rem;color:var(--muted);white-space:nowrap}
.known b{color:var(--ink)}
.search{position:relative}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1rem}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  max-height:55vh;overflow:auto;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.results button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:10px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.results button span:first-child{font-family:var(--disp);font-weight:700;font-size:1.05rem}
.results button span:last-child{color:var(--muted);font-size:.9rem;text-align:right}
.results p{margin:0;padding:12px 14px;color:var(--muted)}
main{flex:1;min-height:0;position:relative;max-width:900px;width:100%;margin:0 auto}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
/* mindmap */
.crumbs .chip{margin-left:auto;padding:5px 10px;font-size:.8rem}
.crumbs{display:flex;align-items:center;gap:4px;padding:0 96px 6px 16px;min-height:40px;flex-wrap:wrap;font-size:.9rem}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:8px;color:var(--accent);font-weight:600}
.crumbs span.cur{padding:4px 6px;font-weight:700}
.crumbs i{color:var(--muted);font-style:normal}
.mapwrap{flex:1;min-height:0;overflow:auto;position:relative;touch-action:pan-x pan-y}
.mapwrap svg{display:block;width:100%;height:auto;margin:0 auto}
.zoom{position:absolute;right:12px;top:0;display:flex;gap:6px;z-index:5}
.zoom button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.1rem;font-weight:700;line-height:1}
.hint{position:absolute;left:16px;bottom:14px;font-size:.8rem;color:var(--muted);background:var(--paper);padding:4px 8px;border-radius:8px;pointer-events:none}
svg text{fill:var(--ink);font-family:var(--ui)}
.br{fill:none;stroke:hsl(var(--h) var(--s) var(--l));stroke-linecap:round}
.nd{cursor:pointer}
.nd .bub{fill:hsl(var(--h) 75% var(--tint));stroke:hsl(var(--h) var(--s) var(--l));stroke-width:3}
.nd:hover .bub,.nd:focus .bub{stroke-width:5}
.nd:focus{outline:none}
.nd:focus-visible .bub{stroke:var(--accent);stroke-width:6}
.ctr{fill:var(--ink)}
.ctrt{fill:var(--paper)!important;font-family:var(--disp)!important;font-weight:800}
.lbl{font-weight:600;font-size:21px;paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.wd{font-family:var(--disp)!important;font-weight:700;font-size:25px;cursor:pointer}
.wd.k{fill:hsl(var(--h) var(--s) var(--l))}
.leaf{paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;font-size:19px;fill:var(--muted)!important;font-family:var(--disp)!important;font-weight:500}
.dot{fill:var(--paper);stroke:hsl(var(--h) var(--s) var(--l));stroke-width:3}
.dot.k{fill:hsl(var(--h) var(--s) var(--l))}
/* controls */
.bar{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
select{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.92rem;max-width:100%;flex:1;min-width:0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 16px 24px}
/* flashcards */
.fc-meta{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;color:var(--muted);margin:4px 0 10px}
.card{perspective:1200px;height:min(46vh,320px);margin:0 auto;max-width:520px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--surface);
  border:2px solid hsl(var(--h) var(--s) var(--l));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;
  box-shadow:6px 6px 0 hsl(var(--h) var(--s) var(--l))}
.back{transform:rotateY(180deg)}
.face .big{font-family:var(--disp);font-weight:800;font-size:clamp(2rem,9vw,3.2rem);line-height:1.05;overflow-wrap:anywhere}
.face .mid{font-size:clamp(1.3rem,5.5vw,1.8rem);font-weight:600;line-height:1.25}
.face .sub{margin-top:10px;color:var(--muted);font-size:.85rem}
.face .tap{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.say{margin-top:14px;border:0;border-radius:999px;padding:8px 16px;background:hsl(var(--h) 75% var(--tint));font-weight:700;font-size:.95rem}
.fc-actions{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px;max-width:520px;margin:16px auto 0}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;font-weight:700;font-size:.95rem}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.okb{border-color:var(--ok);color:var(--ok)}
.btn.nob{border-color:var(--bad);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* quiz */
.qwrap{max-width:560px;margin:0 auto}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prompt{background:var(--surface);border:2px solid var(--ink);border-radius:20px;padding:22px 16px;text-align:center;box-shadow:5px 5px 0 var(--ink);margin-bottom:16px}
.prompt .big{font-family:var(--disp);font-weight:800;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.1}
.prompt .mid{font-size:1.35rem;font-weight:600}
.prompt .q{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;font-size:1.05rem;font-weight:600;display:flex;gap:10px;align-items:center}
.opt .n{flex:0 0 28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:.85rem}
.opt.en{font-family:var(--disp);font-size:1.25rem}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt:disabled{cursor:default}
.next{width:100%;margin-top:14px}
.setup h2,.end h2{font-family:var(--disp);font-weight:800;font-size:1.5rem;margin:6px 0 4px}
.setup p{color:var(--muted);margin:0 0 14px}
.field{margin-bottom:14px}
.field>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.score{font-family:var(--disp);font-weight:800;font-size:4rem;line-height:1;margin:10px 0}
.wrongs{list-style:none;padding:0;margin:14px 0}
.wrongs li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wrongs b{font-family:var(--disp);font-size:1.15rem}
.wrongs button{border:0;background:none;font-size:1.2rem}
/* tabs */
nav{display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1.5px solid var(--line)}
nav button{flex:1;max-width:200px;border:0;background:none;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;font-weight:600;color:var(--muted)}
nav button .ic{font-size:1.3rem;line-height:1}
nav button[aria-selected="true"]{color:var(--ink);background:var(--paper)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;z-index:40;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
  border-top:6px solid hsl(var(--h) var(--s) var(--l));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .path{font-size:.82rem;color:var(--muted)}
.sheet .big{font-family:var(--disp);font-weight:800;font-size:2.6rem;line-height:1.05;margin:6px 0 2px;overflow-wrap:anywhere}
.sheet .mean{font-size:1.3rem;font-weight:600;margin-bottom:16px}
.sheet .row button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:60;display:none}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.sheet{animation:none}}
@media (min-width:700px){h1{font-size:2rem}}

.toast{max-width:min(92vw,460px);text-align:center;line-height:1.4}
.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ipa{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",system-ui,sans-serif;color:var(--muted);font-size:1.05rem}
.exbox{background:var(--paper);border-left:4px solid hsl(var(--h) var(--s) var(--l));border-radius:10px;padding:10px 12px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.exbox p{margin:0;font-size:1.02rem;line-height:1.45;flex:1}
.exbox button{border:0;background:hsl(var(--h) 75% var(--tint));border-radius:999px;padding:6px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.face .ex{margin-top:12px;font-size:.98rem;line-height:1.4;color:var(--ink);max-width:420px}
.face .ipa{margin-top:4px}
.results .ipa{font-size:.85rem;margin-left:6px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);margin:0 4px}
.prompt .sent{font-size:1.25rem;line-height:1.5;font-weight:600}
.prompt .hintvi{margin-top:8px;color:var(--muted);font-size:.92rem}
.uvi{color:var(--muted);font-weight:500}

.sheet{max-height:88vh;overflow:auto}
.ph{border:0;background:none;padding:0 1px;margin:0;font:inherit;color:inherit;border-bottom:2px dotted hsl(var(--h) var(--s) var(--l));cursor:pointer}
.tapnote{font-size:.72rem;color:var(--muted);font-family:var(--ui);margin-left:6px}
.phtip{background:var(--paper);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem;line-height:1.55}
.exw{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-family:var(--disp);font-weight:700;margin:2px 2px 2px 0}
.mic{width:100%;border:0;border-radius:14px;padding:13px;background:var(--accent);color:var(--paper);font-weight:700;font-size:1rem}
.mic.big{padding:18px;font-size:1.15rem;margin-top:14px}
.srlive{padding:12px;text-align:center;font-weight:600}
.pulse{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);margin-right:8px;animation:pl 1s infinite;vertical-align:middle}
@keyframes pl{50%{opacity:.25}}
.srmsg{padding:10px 12px;margin-top:8px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));font-size:.9rem;line-height:1.45}
.srres{margin-top:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.srtop{display:flex;gap:10px;align-items:center}.srtop>div{flex:1}.srem{font-size:2rem}
.srlb{font-weight:800;font-family:var(--disp);font-size:1.2rem}
.srbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.srbar i{display:block;height:100%}
.srheard{margin-top:8px;color:var(--muted);font-size:.92rem}
.srhint{margin:8px 0 0;padding-left:18px;font-size:.9rem;line-height:1.5}
.ih{font-family:var(--disp);font-size:1.35rem;margin:20px 0 2px}.isub{color:var(--muted);margin:0 0 10px;font-size:.9rem}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.icard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.isym{font-size:1.6rem;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;font-family:"Charis SIL","Doulos SIL","Segoe UI",system-ui,sans-serif}
.iuk{font-size:.8rem;color:var(--muted);font-weight:500;font-family:var(--ui)}
.icard p{margin:6px 0 8px;font-size:.92rem;line-height:1.45}
.ilist{margin-top:8px;border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:.9rem}
.iintro{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;line-height:1.55;font-size:.93rem}
.iintro p{margin:0 0 8px}
.mist{padding-left:18px;line-height:1.5;font-size:.93rem}.mist li{margin-bottom:8px}
.wlist button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;text-align:left}
.wlist b{font-family:var(--disp);font-size:1.05rem}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Sổ từ vựng<small id="total"></small></h1>
    <div class="known">Đã thuộc <b id="kc">0</b></div>
  </div>
  <div class="seg" role="group" aria-label="Cách sắp xếp">
    <button id="mA" aria-pressed="true">Theo SGK lớp 6–9</button>
    <button id="mB" aria-pressed="false">Theo chủ đề</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt" autocomplete="off" aria-label="Tìm từ">
    <div class="results" id="res" hidden></div>
  </div>
</header>
<main>
  <section class="view on" id="v-map" aria-label="Sơ đồ">
    <div class="crumbs" id="crumbs"></div>
    <div class="mapwrap" id="mapwrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="zoom"><button id="zin" aria-label="Phóng to">+</button><button id="zout" aria-label="Thu nhỏ">−</button></div>
    <div class="hint" id="hint"></div>
  </section>
  <section class="view" id="v-fc" aria-label="Thẻ từ">
    <div class="bar"><select id="fc1" aria-label="Phạm vi"></select><select id="fc2" aria-label="Phạm vi con"></select></div>
    <div class="bar">
      <button class="chip" id="fcDir" aria-pressed="false">Mặt trước: tiếng Anh</button>
      <button class="chip" id="fcUn" aria-pressed="false">Chỉ từ chưa thuộc</button>
      <button class="chip" id="fcMix">Trộn thẻ</button>
    </div>
    <div class="scroll" id="fcBody"></div>
  </section>
  <section class="view" id="v-qz" aria-label="Đố vui">
    <div class="scroll"><div class="qwrap" id="qzBody"></div></div>
  </section>
  <section class="view" id="v-ipa" aria-label="Phát âm"><div class="scroll"><div id="ipaBody" style="max-width:900px;margin:0 auto"></div></div></section>
</main>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-v="map"><span class="ic">🗺️</span>Sơ đồ</button>
  <button role="tab" aria-selected="false" data-v="fc"><span class="ic">🃏</span>Thẻ từ</button>
  <button role="tab" aria-selected="false" data-v="qz"><span class="ic">🎯</span>Đố vui</button>
  <button role="tab" aria-selected="false" data-v="ipa"><span class="ic">🗣️</span>Phát âm</button>
</nav>
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

  <div style="margin-top:10px"><button class="say" data-say>🔊 Nghe mẫu</button> <button class="say" data-slow>🐢 Chậm</button></div></div>
  <button class="mic big" id="qMic">🎤 Bấm rồi đọc to</button><div id="qSr"></div><div id="qNext"><button class="btn next" id="qSkip">Bỏ qua từ này</button></div>`;
  b.querySelector('.prompt').onclick=e=>{if(e.target.closest('[data-say]'))speak(w.en);if(e.target.closest('[data-slow]'))speak(w.en,true)};
  const next=()=>{if(bs>=70)qz.score++;else qz.wrong.push(w);if(last)qzEnd();else{qz.k++;qzQ()}};
  $('#qSkip').onclick=next;
  $('#qMic').onclick=()=>listen(w,$('#qSr'),res=>{if(!res)return;att++;if(res.score>bs)bs=res.score;
    $('#qMic').textContent=bs>=85?'🎤 Đọc lại lần nữa':'🎤 Nói lại';
    $('#qNext').innerHTML=`<div style="margin-top:8px;text-align:center;color:var(--muted);font-size:.88rem">Lần ${att} · điểm tốt nhất ${bs}/100${bs<70?' · cần từ 70 điểm để tính đạt':''}</div><button class="btn pri next" id="qNx">${last?'Xem kết quả':'Từ tiếp theo'}</button>`;
    $('#qNx').onclick=next})}
function qzEnd(){const pct=Math.round(qz.score/qz.qs.length*100);if(best[qz.key]==null||pct>best[qz.key]){best[qz.key]=pct;try{localStorage.setItem('vbest2',JSON.stringify(best))}catch(e){}}
  const msg=pct===100?'Xuất sắc, không sai câu nào!':pct>=80?'Rất tốt, ôn nốt vài từ sai nhé.':pct>=50?'Khá ổn, luyện thêm một lượt nữa.':'Cần ôn thêm, thử Thẻ từ trước rồi đố lại.';
  $('#qzBody').innerHTML=`<div class="end" style="text-align:center"><h2>Kết quả</h2><div class="score">${qz.score}/${qz.qs.length}</div><p>${msg}</p></div>
  ${qz.wrong.length?`<h3 style="font-family:var(--disp);margin:18px 0 0">Từ cần ôn</h3><ul class="wrongs">${qz.wrong.map((w,i)=>`<li><span><b>${esc(w.en)}</b> <span class="ipa">/${esc(w.ipa)}/</span><br><span style="color:var(--muted)">${esc(w.vi)}</span></span><button data-i="${i}" aria-label="Nghe ${esc(w.en)}">🔊</button></li>`).join('')}</ul>`:''}
  <div class="row">${qz.wrong.length?'<button class="btn pri" id="qRe" style="flex:1">Đố lại câu sai</button>':''}<button class="btn ${qz.wrong.length?'':'pri'}" id="qAg" style="flex:1">Lượt mới</button></div>
  <button class="btn next" id="qSet">Đổi phạm vi</button>`;
  const ul=$('#qzBody .wrongs');if(ul)ul.onclick=e=>{const c=e.target.closest('[data-i]');if(c)speak(qz.wrong[+c.dataset.i].en)};
  if($('#qRe'))$('#qRe').onclick=()=>{qz.qs=shuffle(qz.wrong.slice());qz.k=0;qz.score=0;qz.wrong=[];qzQ()};
  $('#qAg').onclick=()=>qzStart(qz.src);$('#qSet').onclick=qzSetup}
function ipaView(){const b=$('#ipaBody');if(b.dataset.done)return;b.dataset.done=1;
  const cnt={};W.forEach(w=>{w.tk=w.tk||tokenize(w.ipa);new Set(w.tk).forEach(t=>{if(PHM[t])cnt[t]=(cnt[t]||0)+1})});
  const sec=(k,title,sub)=>`<h2 class="ih">${title}</h2><p class="isub">${sub}</p><div class="igrid">${PH.filter(p=>p[2]===k).map(p=>`<div class="icard">
    <div class="isym"><span>/${esc(p[0])}/</span>${p[1]!==p[0]?`<span class="iuk">SGK (giọng Anh): /${esc(p[1])}/</span>`:''}</div>
    <p>${esc(p[3])}</p><div>${p[4].map(e=>`<button class="exw" data-w="${esc(e)}">🔊 ${esc(e)}</button>`).join('')}</div>
    ${cnt[p[0]]?`<button class="ilist" data-s="${esc(p[0])}">Xem và luyện ${cnt[p[0]]} từ có âm này ›</button>`:''}</div>`).join('')}</div>`;
  const ex=(ws)=>ws.map(e=>`<button class="exw" data-w="${esc(e)}">🔊 ${esc(e)}</button>`).join('');
  b.innerHTML=`<div class="iintro"><p><b>Cách đọc phiên âm trong app.</b> Phiên âm và giọng đọc 🔊 theo giọng Mỹ. SGK Global Success in phiên âm giọng Anh; chỗ nào hai giọng ghi khác nhau thì góc thẻ có ghi ký hiệu của SGK.</p>
  <p><b>ˈ</b> trọng âm chính: nhấn mạnh âm tiết ngay sau dấu này (teacher /ˈtitʃər/ nhấn “tea”). <b>ˌ</b> trọng âm phụ, nhấn nhẹ hơn. Dấu <b>ː</b> trong SGK nghĩa là âm dài.</p>
  <p>Ở mỗi từ, chạm vào từng ký hiệu trong phiên âm để xem cách đọc âm đó, và bấm <b>🎤 Nói thử</b> để app chấm.</p>
  <button class="mic" id="goSpeak">🎤 Vào luyện nói ngay</button></div>
  <h2 class="ih">6 lỗi người Việt hay mắc</h2><ol class="mist">
  <li><b>Bỏ âm cuối.</b> Đọc rõ /t/, /d/, /s/, /z/, /k/ ở cuối từ. ${ex(['cat','bed','bus','dogs','book'])}</li>
  <li><b>Đọc /θ/, /ð/ thành “th”, “d”.</b> Đưa đầu lưỡi ra giữa hai răng. ${ex(['think','three','this','mother'])}</li>
  <li><b>Lẫn /ʃ/ và /s/.</b> she khác see, ship khác sip. ${ex(['she','see','ship','sip'])}</li>
  <li><b>Đọc /v/ thành “d” hoặc “b”.</b> Răng trên chạm môi dưới. ${ex(['very','five','vegetable'])}</li>
  <li><b>Đọc /æ/ thành “a”.</b> Há miệng to nhưng khẩu hình “e”. ${ex(['cat','bag','apple'])}</li>
  <li><b>Không nhấn trọng âm.</b> Mỗi từ nhiều âm tiết luôn có một âm tiết nhấn mạnh. ${ex(['teacher','about','computer','banana'])}</li></ol>
  ${sec('v','Nguyên âm đơn','12 âm, phần “hồn” của mỗi từ.')}${sec('d','Nguyên âm đôi','Trượt từ âm đầu sang âm sau trong một hơi.')}${sec('c','Phụ âm','24 âm. Chú ý các âm không có trong tiếng Việt: /θ/, /ð/, /ʃ/, /ʒ/, /dʒ/, /v/, /z/.')}`;
  $('#goSpeak').onclick=()=>{document.querySelector('nav button[data-v=qz]').click();qz.mode='speak';qzSetup()};
  b.onclick=e=>{const l=e.target.closest('.ilist');if(l)openList(l.dataset.s)}}
function openList(sym){const ws=W.filter(w=>(w.tk||(w.tk=tokenize(w.ipa))).includes(sym)).sort((a,b)=>a.en.length-b.en.length);const s=$('#sheet');s.style.setProperty('--h',210);
  s.innerHTML=`<div class="path">Âm /${esc(sym)}/ · ${ws.length} từ</div><div class="phtip">${phTip(sym)}</div>
  <button class="mic" id="lSpeak">🎤 Luyện nói 10 từ có âm này</button>
  <div class="wlist">${ws.slice(0,80).map(w=>`<button data-i="${w.i}"><span><b>${esc(w.en)}</b> <span class="ipa">/${esc(w.ipa)}/</span></span><span class="uvi">${esc(w.vi)}</span></button>`).join('')}</div>
  <button class="btn next" id="lClose">Đóng</button>`;
  $('#veil').classList.add('on');
  s.querySelector('.wlist').onclick=e=>{const c=e.target.closest('[data-i]');if(c)openWord(W[+c.dataset.i])};
  $('#lClose').onclick=closeSheet;
  $('#lSpeak').onclick=()=>{if(!SR){toast(NOSR,6000);return}closeSheet();document.querySelector('nav button[data-v=qz]').click();qz.mode='speak';qz.key='ipa_'+sym;qz.n=10;qzStart(shuffle(ws).slice(0,10))}}
go([]);
</script>
</body>
</html>
